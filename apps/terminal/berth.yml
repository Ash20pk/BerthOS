name: terminal
version: 0.1.0
description: "A full shell terminal for the OS — run_command executes arbitrary commands via bash in a persistent working directory, returning stdout/stderr/exit code, the same way a real terminal session would"

capabilities:
  - filesystem:read:/workspace
  - filesystem:write:/workspace
  # Broadest possible scope: this app IS the escape hatch to a real shell,
  # not a wrapper around one allowlisted binary — declaring process:exec:*
  # honestly reflects that, per manifest-reference.md's "declare
  # capabilities honestly" guidance. Phase 1: declared and logged, not yet
  # kernel-enforced — Phase 3's Landlock policy and the grants-server's
  # human-approval flow are what will eventually gate an app that asks for
  # this much.
  - process:exec:*

exports:
  - name: run_command
    input: { command: string }
    output: { stdout: string, stderr: string, exitCode: number, cwd: string, timedOut: boolean }
  - name: get_cwd
    output: { cwd: string }

on_install:
  - "apk add --no-cache git"
on_agent_ready:
  - "register_with_context_bus"
