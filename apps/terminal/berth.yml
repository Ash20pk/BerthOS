name: terminal
version: 0.1.0
description: "An interactive shared terminal: the agent drives a real shell via run_command/read_screen/send_keys, and a human can watch (and type into) that exact same session live over ttyd"

capabilities:
  # Write-restricted to /workspace, same default as apps/filesystem — but no
  # filesystem:read:<path> is declared, so read access stays today's fully
  # open default (see @berth/sdk's generate-capability-policy.ts) rather than
  # narrowing to just /workspace: a general-purpose shell that can't `cat`
  # outside one directory isn't very useful as a terminal.
  - filesystem:write:/workspace
  # Two jobs. It's the signal @berth/docker-orchestrator's container.ts uses
  # to map the ttyd port and start it — and, since REMEDIATION.md 1.15, it's
  # also what grants Landlock write access to /dev/pts and /dev/ptmx. Without
  # that grant tmux cannot allocate a pty at all on a kernel that enforces
  # Landlock, which made all three of this app's exports fail there while
  # working fine on Docker Desktop. It does not widen what the shell may then
  # do: that's the filesystem/network capabilities above, inherited by every
  # process the shell spawns. No network:connect:* is declared, so — same as every
  # other app here — the shell this spawns has zero outbound network access
  # under deny-by-default, inherited via Landlock same as any other child
  # process of this app.
  - terminal:attach:*

exports:
  - name: run_command
    input: { command: string }
    output: { output: string }
  - name: read_screen
    output: { text: string }
  - name: send_keys
    input: { keys: string }

on_install: []
on_agent_ready:
  - "register_with_context_bus"

# Uncomment to keep the terminal:* capability (the agent can still drive the
# shell) while running unwatched, e.g. in CI — this only stops `berth dev`
# from publishing the ttyd port to the host. See docs/manifest-reference.md.
# expose:
#   terminal: false
