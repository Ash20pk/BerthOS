name: cli-runner
version: 0.1.0
description: "Wraps the git CLI as RPC exports (git_status/git_log/git_diff) over the workspace repo — a resident app that shells out to an external command-line tool rather than only touching the filesystem or network directly"

capabilities:
  - filesystem:read:/workspace
  # New Phase 1 capability namespace: declared but not enforced, same as
  # every other namespace before Phase 3 (see docs/manifest-reference.md's
  # capability grammar section). There's no SDK exec helper yet — the app
  # calls execFile("git", [...fixedArgs]) directly.
  - process:exec:git

exports:
  - name: git_status
    output: { clean: boolean, changes: array }
  - name: git_log
    input: { count: number }
    output: { commits: array }
  - name: git_diff
    input: { path: string }
    output: { diff: string }

on_install:
  - "apk add --no-cache git"
on_agent_ready:
  - "register_with_context_bus"
