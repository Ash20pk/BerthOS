name: github-assistant
version: 1.0.0

capabilities:
  - github:read:repos
  - github:write:issues
  - filesystem:read:/workspace
  - browser:navigate:*.github.com
  # Narrowed to the GitHub API broker's own local port (see
  # docs/github-api-scoping-reference.md) rather than the real remote 443 —
  # same pattern apps/browser-native uses for the egress broker: the kernel
  # only ever needs to permit reaching the local broker, which does the
  # real host/verb-level enforcement.
  - network:connect:8092

exports:
  - name: create_issue
    input: { title: string, body: string }
  - name: get_repo_summary
    input: { repo: string }
    output: { summary: string, open_issues: number }

on_install:
  - "pip install -r requirements.txt"
on_agent_ready:
  - "register_with_context_bus"
