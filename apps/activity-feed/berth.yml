name: activity-feed
version: 0.1.0
description: "Fans in context-bus events from other first-party apps (fs.file_created, notes.added, notes.completed) into one queryable feed — no orchestration, just subscribing to what's already published"

capabilities: []

exports:
  - name: get_recent_activity
    output: { events: array }

on_install: []
on_agent_ready:
  - "register_with_context_bus"
