name: browser-native
version: 0.1.0

capabilities:
  - browser:navigate:*
  - browser:screenshot:*
  # Network is deny-by-default (see docs/capability-tokens-reference.md).
  # Rather than opting out of port-scoping entirely (network:connect:*),
  # this app is scoped to ONLY the egress broker's loopback port — Chromium
  # is launched with that broker as its sole upstream proxy (see
  # cdp-controller.ts), so the broker's own browser:navigate:<pattern>
  # host-matching is what actually decides which sites are reachable.
  # Caveat: Landlock's network scoping is port-only, not address-scoped —
  # network:connect:8090 technically permits connecting to port 8090 on any
  # host, not just 127.0.0.1. The real host-level enforcement comes from the
  # broker itself refusing disallowed hosts, not from this Landlock rule
  # alone; this rule's job is just to make direct-to-internet connections on
  # *other* ports impossible, forcing everything through the broker.
  - network:connect:8090

exports:
  - name: navigate
    input: { url: string }
  - name: click
    input: { selector: string }
  - name: get_page_text
    output: { text: string }

on_install: []
on_agent_ready:
  - "register_with_context_bus"

# Uncomment to keep the browser:* capability (and the agent's ability to
# drive Chromium) while running headless/unwatched, e.g. in CI — this only
# stops `berth dev` from publishing the noVNC/CDP ports to the host, it
# doesn't narrow what the app is allowed to do. See docs/manifest-reference.md.
# expose:
#   browser: false
