name: filesystem
version: 0.1.0

capabilities:
  - filesystem:read:/workspace
  - filesystem:write:/workspace
  - filesystem:read:/context
  - filesystem:write:/context

exports:
  - name: write_file
    input: { path: string, content: string }
  - name: read_file
    input: { path: string }
    output: { content: string }
  - name: list_files
    output: { files: array }
  - name: write_context_file
    input: { path: string, content: string }
  - name: read_context_file
    input: { path: string }
    output: { content: string }
  - name: tag_context_file
    input: { path: string, task: string, relatedApps: array }
  - name: query_context
    input: { text: string }
    output: { results: array }
  - name: publish_context_event
    input: { topic: string, payload: object }
  # Diagnostic export for capability-enforcement.mjs's truncate check —
  # truncate(2) is a write-ish right Landlock only enforces when it's in the
  # handled set, so this exercises it directly rather than through open().
  - name: truncate_file
    input: { path: string, size: number }
  # Diagnostic export for capability-enforcement.mjs's network deny-by-default
  # check — this app declares no network:connect capability, so it should
  # never be able to reach out.
  - name: probe_network_connect
    input: { host: string, port: number }
    output: { connected: boolean }
  # The UDP and raw-socket halves of the same check. Landlock has no access
  # right for either, so these exercise agent-init's seccomp filter and its
  # CAP_NET_RAW drop rather than the Landlock ruleset.
  - name: probe_network_udp
    input: { host: string, port: number }
    output: { sent: boolean }
  - name: probe_raw_socket
    input: { host: string }
    output: { opened: boolean }
  # Diagnostic export for capability-enforcement.mjs's namespace check —
  # creating a user namespace would hand back every capability agent-init just
  # dropped, so this exercises the seccomp filter that refuses it.
  - name: probe_user_namespace
    output: { created: boolean, regainedCaps: boolean }

on_install: []
on_agent_ready:
  - "register_with_context_bus"
