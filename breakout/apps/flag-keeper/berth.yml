name: flag-keeper
version: 0.1.0
description: "The break-out box's co-tenant: holds the second flag as a per-app secret, so the challenge covers one workload reaching another's credentials."

capabilities:
  - filesystem:read:/workspace/.berth/dev-workspace/flag-keeper
  - filesystem:write:/workspace/.berth/dev-workspace/flag-keeper
  - filesystem:read:/workspace/breakout
  - filesystem:read:/workspace/packages
  - filesystem:read:/workspace/node_modules

# The co-tenant flag. Per-app secret scoping puts it in
# /run/berth/secrets.flag-keeper.env, 0600 owned by this app's uid — and
# nowhere in breakout-target's environment.
secrets:
  - BREAKOUT_FLAG_COTENANT

exports:
  - name: still_here
    output: { ok: boolean }

on_install: []
on_agent_ready: []
