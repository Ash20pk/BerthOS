name: Multi-App Sandbox Milestone

# Real, running verification that every app in a shared multi-app sandbox
# gets its own independent Landlock ruleset — see
# packages/docker-orchestrator/test/multi-app-milestone.mjs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Run multi-app-milestone.mjs
        working-directory: packages/docker-orchestrator
        run: node test/multi-app-milestone.mjs
