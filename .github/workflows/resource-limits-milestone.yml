name: Resource Limits Milestone

# See packages/docker-orchestrator/test/resource-limits-milestone.mjs. In a
# two-app sandbox, an app that fork-bombs, allocates past its memory limit and
# spins is held to its own cgroup's limits while its neighbour and the
# context-bus daemon keep answering; it can't write any cgroup file; and a
# control boot with per-app cgroups off shows the fork bomb isn't stopped at
# the app's limit. Needs cgroup v2 with nsdelegate and Docker 28+; on a runner
# without them the milestone fails with the boot log's reason, not a timeout.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.21.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Run resource-limits-milestone.mjs
        working-directory: packages/docker-orchestrator
        run: node test/resource-limits-milestone.mjs
