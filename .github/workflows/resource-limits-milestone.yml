name: Resource Limits Milestone

# See packages/docker-orchestrator/test/resource-limits-milestone.mjs. In a
# two-app sandbox, an app that fork-bombs, allocates past its memory limit and
# spins is held to its own cgroup's limits while its neighbour and the
# context-bus daemon keep answering; it can't write any cgroup file; and a
# control boot with per-app cgroups off shows the fork bomb isn't stopped at
# the app's limit. It also checks BERTH_REQUIRE_APP_CGROUPS refuses a boot
# without them. Needs cgroup v2 with nsdelegate and Docker 28+
# (--security-opt writable-cgroups=true). The first step prints what the runner
# has and, if either is missing, the job skips the milestone with a notice
# instead of failing on a host that can't run it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check the runner can delegate cgroups (Docker 28+, cgroup v2 with nsdelegate)
        id: prereqs
        run: |
          docker version
          echo "--- /sys/fs/cgroup mount (mount options - fstype source superblock options):"
          grep ' /sys/fs/cgroup ' /proc/self/mountinfo || echo "(not mounted)"
          server="$(docker version --format '{{.Server.Version}}' 2>/dev/null || true)"
          fs="$(awk '$5 == "/sys/fs/cgroup" { for (i = 6; i <= NF; i++) if ($i == "-") { print $(i + 1); exit } }' /proc/self/mountinfo)"
          opts="$(awk '$5 == "/sys/fs/cgroup" { for (i = 6; i <= NF; i++) if ($i == "-") { print $(i + 3); exit } }' /proc/self/mountinfo)"
          missing=""
          [ "${server%%.*}" -ge 28 ] 2>/dev/null || missing="${missing:+$missing; }Docker server ${server:-unknown} is older than 28, so it has no writable-cgroups"
          [ "$fs" = "cgroup2" ] || missing="${missing:+$missing; }/sys/fs/cgroup is ${fs:-absent}, not cgroup2"
          echo ",$opts," | grep -q ',nsdelegate,' || missing="${missing:+$missing; }the cgroup2 mount has no nsdelegate (options: ${opts:-none})"
          if [ -n "$missing" ]; then
            echo "::notice title=Resource limits milestone skipped::This runner can't delegate a cgroup to a sandbox: ${missing}."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "Docker ${server}, cgroup2 with nsdelegate: the milestone can run."
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.prereqs.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: steps.prereqs.outputs.ok == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.21.0

      - if: steps.prereqs.outputs.ok == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - if: steps.prereqs.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.prereqs.outputs.ok == 'true'
        run: pnpm build

      - if: steps.prereqs.outputs.ok == 'true'
        name: Run resource-limits-milestone.mjs
        working-directory: packages/docker-orchestrator
        run: node test/resource-limits-milestone.mjs
