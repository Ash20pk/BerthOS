name: on_install Build-Time Execution

# Verifies that a manifest's on_install is a Docker build layer and that
# nothing executes it at container boot — see REMEDIATION.md 1.5 and
# packages/docker-orchestrator/test/on-install-milestone.mjs.
#
# Like published-port-security.yml and unlike capability-enforcement.yml, none
# of this depends on the runner's kernel providing Landlock: the test relaxes
# BERTH_REQUIRE_ENFORCEMENT precisely because what it asserts is about *when*
# shell runs, not about what the kernel refuses. It needs a real Docker daemon,
# a real image build, and a real container restart, which is why it's here
# rather than in build-lint-test.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.21.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Run on-install-milestone.mjs
        working-directory: packages/docker-orchestrator
        run: node test/on-install-milestone.mjs
