name: Python SDK Milestone

# Real, running verification that @berthos/sdk-python's RPC framing is
# byte-compatible with @berthos/sdk's — see
# packages/docker-orchestrator/test/python-sdk-milestone.mjs. Boots a real
# apps/hello-world-py container and drives it with a real RPC round trip
# over its actual container stdio.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.21.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Run python-sdk-milestone.mjs
        working-directory: packages/docker-orchestrator
        run: node test/python-sdk-milestone.mjs
