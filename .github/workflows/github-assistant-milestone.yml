name: GitHub Assistant Milestone

# Real, running verification that apps/github-assistant (promoted from
# examples/github-assistant) actually calls the GitHub REST API for real —
# see packages/docker-orchestrator/test/github-assistant-milestone.mjs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.21.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Run github-assistant-milestone.mjs
        working-directory: packages/docker-orchestrator
        run: node test/github-assistant-milestone.mjs
