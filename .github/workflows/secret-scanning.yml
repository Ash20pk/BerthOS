name: Secret Scanning

# Scans the full git history (not just the working tree) for committed
# secrets — API keys, tokens, private keys — using gitleaks. Verified
# locally before this was added: both a working-tree-only scan and a full
# git-history scan of this repo (159 commits at the time) came back clean.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans git history, not just the checked-out tree —
          # a shallow clone (actions/checkout's default) would only let it
          # see the most recent commit, missing anything committed and
          # later "removed" in a later commit (still present in history,
          # and still a real leak if it happened).
          fetch-depth: 0

      # v3, not v2: v2 runs on the Node 20 runtime GitHub is retiring (opt-out
      # required starting 2026-06-02, removed entirely 2026-09-16) — v3 is a
      # drop-in swap to the Node 24 runtime with no input/output changes.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required when the repo belongs to a
          # GitHub Organization — this repo is under a personal account
          # (confirmed via `gh repo view`), so it's intentionally omitted.
          # Add it (as a repo secret) if this repo is ever transferred to
          # an org.
