name: HTTP RPC Bridge Milestone

# Real, running verification that startContainer()'s `httpRpc` option
# produces a live, host-reachable, bearer-token-authenticated HTTP RPC
# bridge — see packages/docker-orchestrator/test/http-rpc-bridge-milestone.mjs.
# This is the mechanism a process with no Docker API access (a Python
# client, see experimental/agents-python's Computer.connect()) uses to call a
# resident app's exports. Separate from Agents Milestone's
# computer-http-rpc-milestone.mjs, which exercises the same feature through
# @berthos/agents' Computer.boot({httpRpc}) using a production-target image —
# this workflow's test uses a dev-target image specifically so it verifies
# the bridge mechanism itself, not entangled with Landlock enforcement.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.21.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Run http-rpc-bridge-milestone.mjs
        working-directory: packages/docker-orchestrator
        run: node test/http-rpc-bridge-milestone.mjs
