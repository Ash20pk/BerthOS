name: Secrets Milestone

# Real, running verification of REMEDIATION.md 5.5 — see
# packages/docker-orchestrator/test/secrets-milestone.mjs. A booted sandbox's
# provider API key and RPC bearer token are absent from `docker inspect`, from
# a fresh `docker exec` process, from a real snapshot's env.json, and from its
# committed image tarball — while still reaching the app, which the same run
# proves by authenticating the HTTP RPC bridge with the token it was never
# given in `Env`. That pairing is the point: every absence check here would be
# trivially satisfied by never delivering the credential at all.
#
# Its own workflow rather than a step in another, for the same reason
# Published Port Security has one: this is a security boundary, and a failure
# here should be legible as "secrets regressed" in the checks list rather than
# buried in a job that also builds three other images. Runs anywhere Docker
# does — nothing here depends on the runner's kernel enforcing Landlock.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.21.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Run secrets-milestone.mjs
        working-directory: packages/docker-orchestrator
        run: node test/secrets-milestone.mjs
