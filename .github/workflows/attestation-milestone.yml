name: Attestation Milestone

# BUILD_PLAN M2.1 — see
# packages/docker-orchestrator/test/attestation-milestone.mjs. `berth attest
# <runId>` emits a per-run record binding the audit-chain head, enforcement
# as measured for the boot (agent-init's ruleset report + the doctor probe),
# the enforced capability-policy hash, boot id, and image digest. The
# standalone verifier (scripts/verify-attestation.mjs, no Berth dependency)
# accepts the genuine record and rejects both a hand-edited one and a
# verdict edit with a recomputed self-hash. A control boot under a seccomp
# profile that ENOSYSes the landlock syscalls attests NOT_ENFORCED — the
# negative control is the feature.
#
# ubuntu-latest has Landlock in its LSM stack, so the measured boot here
# exercises the ACTIVE path; the control boot exercises NOT_ENFORCED on the
# same runner.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.21.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Run attestation-milestone.mjs
        working-directory: packages/docker-orchestrator
        run: node test/attestation-milestone.mjs
