name: Prompt Injection Milestone

# Runs examples/prompt-injection against a real Linux kernel: a fully
# compromised (scripted) model obeys an injected instruction to write a
# backdoor outside its declared scope, and the demo exits non-zero unless the
# kernel refused the write AND the refusal is on a verifiable audit chain. The
# demo doubles as the milestone test — a regression in Landlock enforcement or
# the audit trail fails this job. Only meaningful on a kernel with Landlock
# active (ubuntu-latest has it; Docker Desktop for Mac does not).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report host LSM stack
        run: cat /sys/kernel/security/lsm || echo "could not read /sys/kernel/security/lsm (non-fatal, diagnostic only)"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.21.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Run the prompt-injection demo (exits non-zero on a regression)
        working-directory: examples/prompt-injection
        run: node index.mjs
