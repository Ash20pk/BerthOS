name: Publish npm packages

# Manual-only, dry-run by default: this workflow is never triggered by a
# push or tag, only a human clicking "Run workflow" in the Actions tab and
# explicitly choosing dry_run=false. `pnpm -r publish` walks every workspace
# package in dependency order, skipping anything marked "private": true
# (every app/example/test-fixture package in this repo already is) — see
# gaps.md gap #18 and docs/agents-reference.md for why this exists.
#
# One-time setup this workflow depends on but can't do itself: an
# npm-organization automation token with publish rights to the @berth scope,
# stored as the NPM_TOKEN repository secret.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build + pack, print what would publish, upload nothing)"
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm provenance (publishConfig.provenance in every public package)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.21.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      # Same gate build-lint-test.yml runs on every PR — a publish workflow
      # is the last place a regression should slip through unnoticed.
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test

      # SBOM of exactly what this workflow is about to publish (BUILD_PLAN
      # M0.1): Syft walks the workspace and pnpm-lock.yaml and emits SPDX
      # JSON, uploaded as a run artifact so every publish — dry or real —
      # leaves a machine-readable record of its dependency tree.
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: berth-sbom.spdx.json
          upload-artifact: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sbom
          path: berth-sbom.spdx.json

      - name: Dry run (no upload)
        if: ${{ inputs.dry_run }}
        run: pnpm publish:npm:dry-run

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: pnpm publish:npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
