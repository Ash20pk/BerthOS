name: Per-App Secrets Milestone

# BUILD_PLAN M1.3 — see
# packages/docker-orchestrator/test/per-app-secrets-milestone.mjs. A secret an
# app declares under `secrets:` in berth.yml reaches that app and no sibling:
# absent from the sibling's process environment, from the shared secrets
# file, and unreadable through /proc/<pid>/environ and the per-app file's
# 0600 DAC. A control boot with no declaration shows the token reaching both
# apps — proving the isolation assertions can fail.
#
# Every boundary here is DAC (per-app uids + file modes), so this runs
# anywhere Docker does — no Landlock dependence.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.21.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Run per-app-secrets-milestone.mjs
        working-directory: packages/docker-orchestrator
        run: node test/per-app-secrets-milestone.mjs
