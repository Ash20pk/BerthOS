name: K8s Adapter Milestone

# Real, running verification of @berthos/adapter-k8s against a live (if
# throwaway) Kubernetes cluster — provisioned via `kind`, which needs no
# cloud account. See
# packages/adapters/adapter-k8s/test/k8s-adapter-milestone.mjs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true
          version: v0.32.0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.21.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Run k8s-adapter-milestone.mjs
        working-directory: packages/adapters/adapter-k8s
        run: node test/k8s-adapter-milestone.mjs
