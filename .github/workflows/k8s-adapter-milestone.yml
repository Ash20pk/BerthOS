name: K8s Adapter Milestone

# Real, running verification of @berthos/adapter-k8s against a live (if
# throwaway) Kubernetes cluster — provisioned via `kind`, which needs no
# cloud account. See
# experimental/adapters/adapter-k8s/test/k8s-adapter-milestone.mjs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true
          version: v0.32.0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.21.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Run k8s-adapter-milestone.mjs
        working-directory: experimental/adapters/adapter-k8s
        run: node test/k8s-adapter-milestone.mjs
