name: Fresh install

# What a new user does, against the published packages only: no checkout of
# this repository, nothing built from source. Install the CLI from npm,
# check the kernel, scaffold an app, build and test it, boot it (in a
# container, and in a microVM), and import the Python SDK from PyPI.
#
# ubuntu-latest's kernel enforces Landlock, so `berth doctor` must say ACTIVE
# here and `berth test` runs under a production image with enforcement
# required.
#
# Run it after a release: Actions → Fresh install → Run workflow, with the
# version just published (or "latest").
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to test (default: latest)"
        type: string
        default: latest

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # berth init runs pnpm install. pnpm 10 skips an unapproved install
        # script with a warning; pnpm 11 fails the install, so both are tested.
        pnpm: ["10.21.0", "11"]
    env:
      VERSION: ${{ inputs.version || 'latest' }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ matrix.pnpm }}

      - name: Install the CLI from npm
        run: |
          npm install -g "@berthos/cli@${VERSION}"
          berth --version

      - name: berth doctor says ACTIVE
        run: |
          berth doctor | tee doctor.txt
          grep -q '^enforcement: ACTIVE' doctor.txt

      - name: berth init scaffolds a project that installs
        working-directory: ${{ runner.temp }}
        run: |
          berth init my-app --template hello-world
          cd my-app
          sdk=$(node -p "require('./package.json').dependencies['@berthos/sdk']")
          installed=$(npm view @berthos/cli@"${VERSION}" version)
          echo "@berthos/sdk dependency: ${sdk} (CLI ${installed})"
          test "${sdk}" = "^${installed}"
          test -d node_modules/@berthos/sdk

      - name: Build and berth test
        working-directory: ${{ runner.temp }}/my-app
        run: |
          pnpm build
          berth test

      - name: berth mcp boots the app
        working-directory: ${{ runner.temp }}/my-app
        run: berth mcp --app my-app --app-dir . --warm

  vm:
    # The microVM runtime from npm: berth vm install downloads berth-vmm, its
    # libkrun, the kernel and the rootfs from the release the CLI pins, each
    # checked against its sha256. GitHub's x86_64 Linux runners have KVM, so
    # the app boots there; its macOS runners have no nested virtualization,
    # so on macOS the download and berth-vmm loading its libkrun are checked.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    env:
      VERSION: ${{ inputs.version || 'latest' }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.21.0

      - name: Open /dev/kvm to the runner user
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          [ -w /dev/kvm ] || sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Install the CLI from npm
        run: |
          npm install -g "@berthos/cli@${VERSION}"
          berth --version

      - name: berth vm install downloads and verifies everything
        run: |
          berth vm install | tee install.txt
          for kind in berth-vmm libkrun kernel rootfs; do
            grep -q "✔ $kind " install.txt || { echo "::error::berth vm install did not install $kind"; exit 1; }
          done
          ls -l ~/.berth/vm/bin

      - name: berth-vmm loads the libkrun beside it
        run: |
          env -u DYLD_LIBRARY_PATH -u LD_LIBRARY_PATH ~/.berth/vm/bin/berth-vmm run --help >/dev/null
          if [ "$RUNNER_OS" = macOS ]; then otool -L ~/.berth/vm/bin/berth-vmm; else ldd ~/.berth/vm/bin/berth-vmm; fi

      - name: berth doctor --sandbox vm passes
        if: runner.os == 'Linux'
        run: berth doctor --sandbox vm

      - name: A new app boots in the VM
        if: runner.os == 'Linux'
        working-directory: ${{ runner.temp }}
        run: |
          berth init my-app --template hello-world
          cd my-app
          pnpm build
          berth mcp --app my-app --app-dir . --warm --runtime vm

  pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ inputs.version || 'latest' }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install berthos-sdk from PyPI and import it
        run: |
          if [ "$VERSION" = latest ]; then pip install berthos-sdk; else pip install "berthos-sdk==${VERSION}"; fi
          python -c "import berth_sdk, importlib.metadata as m; print('berthos-sdk', m.version('berthos-sdk'))"
