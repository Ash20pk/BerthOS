name: Fresh install

# What a new user does, against the published packages only: no checkout of
# this repository, nothing built from source. Install the CLI from npm,
# check the kernel, scaffold an app, build and test it, boot it, and import
# the Python SDK from PyPI.
#
# ubuntu-latest's kernel enforces Landlock, so `berth doctor` must say ACTIVE
# here and `berth test` runs under a production image with enforcement
# required.
on:
  push:
    branches: [ci/fresh-install-check]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to test (default: latest)"
        type: string
        default: latest

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # berth init runs pnpm install. pnpm 10 skips an unapproved install
        # script with a warning; pnpm 11 fails the install, so both are tested.
        pnpm: ["10.21.0", "11"]
    env:
      VERSION: ${{ inputs.version || 'latest' }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ matrix.pnpm }}

      - name: Install the CLI from npm
        run: |
          npm install -g "@berthos/cli@${VERSION}"
          berth --version

      - name: berth doctor says ACTIVE
        run: |
          berth doctor | tee doctor.txt
          grep -q '^enforcement: ACTIVE' doctor.txt

      - name: berth init scaffolds a project that installs
        working-directory: ${{ runner.temp }}
        run: |
          berth init my-app --template hello-world
          cd my-app
          sdk=$(node -p "require('./package.json').dependencies['@berthos/sdk']")
          installed=$(npm view @berthos/cli@"${VERSION}" version)
          echo "@berthos/sdk dependency: ${sdk} (CLI ${installed})"
          test "${sdk}" = "^${installed}"
          test -d node_modules/@berthos/sdk

      - name: Build and berth test
        working-directory: ${{ runner.temp }}/my-app
        run: |
          pnpm build
          berth test

      - name: berth mcp boots the app
        working-directory: ${{ runner.temp }}/my-app
        run: berth mcp --app my-app --app-dir . --warm

  pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install berthos-sdk from PyPI and import it
        run: |
          pip install berthos-sdk
          python -c "import berth_sdk, importlib.metadata as m; print('berthos-sdk', m.version('berthos-sdk'))"
