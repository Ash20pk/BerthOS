name: Daemon Confinement Milestone

# BUILD_PLAN M1.2 — see
# packages/docker-orchestrator/test/daemon-confinement-milestone.mjs. The
# pre-agent-init daemons are confined (threat model B4): context-bus-daemon
# runs as its own uid under an agent-init Landlock domain; mesh-daemon applies
# its own; the semantic-fs sidecar empties its capability bounding set once
# the mount is up. A compromised-daemon simulation is denied by the kernel; a
# BERTH_DISABLE_DAEMON_CONFINEMENT=1 boot restores the pre-M1.2 posture and
# the same simulation succeeds — the negative control.
#
# Landlock-denial checks self-skip on a non-enforcing kernel; ubuntu-latest
# enforces Landlock, so they run here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.21.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Run daemon-confinement-milestone.mjs
        working-directory: packages/docker-orchestrator
        run: node test/daemon-confinement-milestone.mjs
