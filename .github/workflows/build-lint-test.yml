name: Build, Lint, Test

# Fast baseline: plain TypeScript compile + tsc --noEmit + each package's own
# unit tests. No Docker, no containers — turbo run test only runs
# *.test.ts-derived unit tests, never the Docker-based milestone scripts
# under packages/docker-orchestrator/test/ (those have their own workflows).
# Also runs packages/agents-python's pytest suite — same "fast, no Docker"
# posture, just a second language turbo doesn't orchestrate.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.21.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test

      # The Rust crates are Linux-only (Landlock, /dev/fuse, wg0) and are
      # normally only ever compiled inside base.Dockerfile's builder stages,
      # which means their unit tests never ran anywhere. agent-init's tests
      # assert things a Docker-based enforcement test structurally cannot on a
      # developer's Mac — Docker Desktop's linuxkit kernel has Landlock absent
      # from its LSM stack, so capability-enforcement.mjs degrades every denial
      # check to informational there. This runner is Linux, so they run.
      #
      # context-bus-daemon needs protoc for its build.rs (base.Dockerfile's
      # builder stage installs it there). It used to be skipped here for that
      # reason; it is in now because its peer-identity rules — which decide
      # whether an app can publish under another app's name (REMEDIATION.md
      # 1.14) — have unit tests, and a security rule whose tests never run
      # anywhere is not tested.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Test the Rust crates
        run: |
          cargo test --manifest-path packages/agent-init/Cargo.toml
          cargo test --manifest-path packages/mesh-daemon/Cargo.toml
          cargo test --manifest-path packages/context-bus-daemon/Cargo.toml

      # Same reasoning as the Rust crates above, and the same gap: semantic-fs
      # is Linux-only (bazil.org/fuse doesn't build on darwin at all), so its
      # tests could never run on a developer's Mac and nothing ran them here
      # either. This runner is Linux and non-root, which is exactly what the
      # ownership tests need — they chown to a group the process is already in,
      # since chowning to an arbitrary gid needs privilege.
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/semantic-fs-daemon/go.mod
          cache-dependency-path: packages/semantic-fs-daemon/go.sum
      - name: Test semantic-fs-daemon
        working-directory: packages/semantic-fs-daemon
        run: go test ./...

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Test packages/agents-python
        working-directory: packages/agents-python
        run: |
          pip install -e ".[dev]"
          pytest

      # Gated at high+ (not "any finding"): moderate/low advisories often
      # have no available fix yet, or apply to a call path this project
      # never exercises — gating on those would make this step chronically
      # red for issues no one can act on, which erodes trust in the gate
      # faster than it catches anything. high/critical is the threshold most
      # security-conscious CI setups actually block on. As of the commit
      # that added this step, `pnpm audit` was clean (0 findings) — the
      # protobufjs/uuid transitive vulnerabilities found at the time (via
      # @xenova/transformers and dockerode respectively) were fixed with
      # pnpm.overrides in package.json, not by ignoring them here.
      - run: pnpm audit --audit-level=high
