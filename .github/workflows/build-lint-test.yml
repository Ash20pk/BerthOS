name: Build, Lint, Test

# Fast baseline: plain TypeScript compile + tsc --noEmit + each package's own
# unit tests. No Docker, no containers — turbo run test only runs
# *.test.ts-derived unit tests, never the Docker-based milestone scripts
# under packages/docker-orchestrator/test/ (those have their own workflows).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
