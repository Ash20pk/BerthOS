name: Containment Benchmark

# See bench/README.md. One probe (bench/probe/probe.mjs),
# several sandboxes, a generated scorecard. This workflow runs the three
# locally runnable columns: plain Docker, Berth as shipped, and Berth with its
# kernel tier deliberately switched off.
#
# The run FAILS if the weakened configuration does not score worse than the
# shipped one (bench/run.mjs enforces it). That is the positive control: a
# benchmark where sabotaging the sandbox changes nothing is not measuring the
# sandbox.
#
# ubuntu-latest has Landlock in its active LSM stack, so Berth's filesystem and
# network rows measure a real kernel boundary here. The generated table records
# the enforcement measurement either way.
#
# The E2B column is not run: it needs an account and an API key, which is a
# human gate. Its column reads NOT RUN rather than being mocked.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.21.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Run the containment benchmark
        # To a scratch path, not bench/results/: the committed scorecard also
        # carries the E2B column this job can't run, and run.mjs refuses to
        # overwrite a file with columns the run didn't produce.
        run: node bench/run.mjs --harness docker,berth,berth-weakened --out "$RUNNER_TEMP/bench/results.json" --md "$RUNNER_TEMP/bench/table.md"

      - name: Publish the scorecard
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: containment-benchmark
          path: ${{ runner.temp }}/bench/
