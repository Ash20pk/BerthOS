name: Computer Snapshots Milestone

# Real, running verification of `berth snapshot create/restore` — see
# packages/docker-orchestrator/test/snapshot-milestone.mjs. Uses a production
# (self-contained) apps/filesystem image so the test genuinely exercises
# docker commit()/getArchive(), not a bind-mounted /workspace that would
# "survive" trivially regardless.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Hosts with KVM (GitHub's Linux runners included) default to the microVM;
# these jobs test the Docker path, so they ask for it. --runtime vm still wins.
env:
  BERTH_SANDBOX: docker

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.21.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Run snapshot-milestone.mjs
        working-directory: packages/docker-orchestrator
        run: node test/snapshot-milestone.mjs

      - name: Run snapshot-crash-milestone.mjs
        working-directory: packages/docker-orchestrator
        run: node test/snapshot-crash-milestone.mjs
