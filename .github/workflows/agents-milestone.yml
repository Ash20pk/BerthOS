name: Agents Milestone

# Real, running verification that @berthos/agents's Computer boots a
# live sandbox and produces a callable tool list from resident-app exports —
# see experimental/agents/test/computer-boot-milestone.mjs,
# computer-multi-app-milestone.mjs, computer-http-rpc-milestone.mjs,
# governance-gate-milestone.mjs, mcp-client-milestone.mjs,
# code-interpreter-milestone.mjs, and declarative-config-milestone.mjs. The
# provider-swap/crew milestone tests need real LLM API credentials and are
# intentionally not run here — see docs/agents-reference.md.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.21.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Run computer-boot-milestone.mjs
        working-directory: experimental/agents
        run: node test/computer-boot-milestone.mjs

      - name: Run computer-multi-app-milestone.mjs
        working-directory: experimental/agents
        run: node test/computer-multi-app-milestone.mjs

      - name: Run computer-http-rpc-milestone.mjs
        working-directory: experimental/agents
        run: node test/computer-http-rpc-milestone.mjs

      - name: Run governance-gate-milestone.mjs
        working-directory: experimental/agents
        run: node test/governance-gate-milestone.mjs

      - name: Run mcp-client-milestone.mjs
        working-directory: experimental/agents
        run: node test/mcp-client-milestone.mjs

      - name: Run code-interpreter-milestone.mjs
        working-directory: experimental/agents
        run: node test/code-interpreter-milestone.mjs

      - name: Run declarative-config-milestone.mjs
        working-directory: experimental/agents
        run: node test/declarative-config-milestone.mjs
