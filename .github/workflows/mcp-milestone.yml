name: MCP Bridge Milestone

# Real, running verification of the MCP bridge (`berth mcp`) — see
# packages/docker-orchestrator/test/mcp-milestone.mjs. Boots a real
# apps/filesystem dev container, spawns `berth mcp --app=filesystem` as a
# real child process, and drives it with the actual
# @modelcontextprotocol/sdk Client over real stdio. Since launch-plan 1.5 it
# also covers the front-door path: `berth mcp` booting its own sandbox when
# none is running, and a denied tool call coming back as an explanation that
# names the berth.yml line which would allow it (Tests 3-5). Those add two more
# container boots and one more image build, hence the raised timeout.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.21.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Run mcp-milestone.mjs
        working-directory: packages/docker-orchestrator
        run: node test/mcp-milestone.mjs
