name: CodeQL

# SAST across every real language in this repo. javascript-typescript covers
# the whole TS codebase (including packages/docker-orchestrator and
# packages/manifest-schema); go covers semantic-fs-daemon; rust covers the
# three independent crates the trust boundary itself lives in — agent-init
# (Landlock policy application), context-bus-daemon, and mesh-daemon. All
# three language identifiers ("javascript-typescript", "go", "rust") are
# real, current CodeQL-supported languages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Interpreted — no build needed to extract a database.
          - language: javascript-typescript
            build-mode: none
          # Compiled, and CodeQL's own docs say build-mode: none isn't
          # supported for Go — a single, simple module, so autobuild's
          # heuristics (plain `go build ./...`) are enough.
          - language: go
            build-mode: autobuild
          # `none` is the only mode CodeQL's Rust extractor accepts — it
          # refuses `manual` outright ("Rust does not support the manual build
          # mode"), which is what this job used to do and why it failed at
          # init before running a single query. That also means the absence of
          # a root Cargo.toml joining agent-init/context-bus-daemon/mesh-daemon
          # no longer matters: nothing is built, so nothing has to be
          # discovered. The explicit per-crate `cargo build` that used to be
          # here is gone with it, as is the protoc install it needed.
          - language: rust
            build-mode: none

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
