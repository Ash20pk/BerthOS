name: Python SDK Context Bus Milestone

# Real, running verification of @berth/sdk-python's context-bus client
# (compiled-protobuf framing) interoperating with a real TypeScript
# subscriber through the actual Rust daemon — see
# packages/docker-orchestrator/test/python-sdk-context-bus-milestone.mjs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.21.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Run python-sdk-context-bus-milestone.mjs
        working-directory: packages/docker-orchestrator
        run: node test/python-sdk-context-bus-milestone.mjs
