name: Context Bus Milestone (Phase 2)

# Real, running verification that two resident apps in one sandbox can
# communicate over the context bus without explicit orchestration — see
# packages/docker-orchestrator/test/context-bus-milestone.mjs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.21.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Run context-bus-milestone.mjs
        working-directory: packages/docker-orchestrator
        run: node test/context-bus-milestone.mjs
