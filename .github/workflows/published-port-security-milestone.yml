name: Published Port Security

# Verifies that the ports `berth dev` publishes to the host are bound to
# loopback and gated by a per-boot credential — see
# packages/docker-orchestrator/test/published-port-security-milestone.mjs.
#
# Unlike capability-enforcement.yml, none of this depends on the runner's
# kernel providing Landlock: Docker's port binding, ttyd's basic auth, and
# x11vnc's RFB handshake behave identically on any Docker host. It runs here
# anyway because it needs a real Docker daemon and two real image builds.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Hosts with KVM (GitHub's Linux runners included) default to the microVM;
# these jobs test the Docker path, so they ask for it. --runtime vm still wins.
env:
  BERTH_SANDBOX: docker

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.21.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Run published-port-security-milestone.mjs
        working-directory: packages/docker-orchestrator
        run: node test/published-port-security-milestone.mjs
