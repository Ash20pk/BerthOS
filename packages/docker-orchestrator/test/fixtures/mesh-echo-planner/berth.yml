name: mesh-echo-planner
version: 0.1.0
description: "mesh-milestone.mjs fixture — declares network:peer:mesh-echo-browser, a mutual match with mesh-echo-browser"

capabilities:
  - network:peer:mesh-echo-browser
  # This fixture runs its own HTTP echo listener on 0.0.0.0:9000. Landlock
  # denies AccessNet::BindTcp by default, so that listen() needs an explicit
  # grant or it fails EACCES under full enforcement (as CI reproduced).
  #
  # This used to say `network:connect:*` — the only way to get bind
  # permission before `network:bind:<port>` existed, which switched outbound
  # port scoping off entirely just to be allowed to listen. That escape hatch
  # is no longer needed: bind is now its own declarable, per-port privilege,
  # and this fixture keeps deny-by-default outbound access.
  - network:bind:9000

exports:
  - name: ping
    output: { message: string }

on_install: []
on_agent_ready:
  - "register_with_context_bus"
