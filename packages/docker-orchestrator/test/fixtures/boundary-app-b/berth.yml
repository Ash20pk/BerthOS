name: boundary-app-b
version: 0.1.0
description: "capability-enforcement.mjs's cross-app boundary fixture — scoped ONLY to its own subdirectory, sharing a container with boundary-app-a, whose subdirectory it must NOT be able to reach."

capabilities:
  # Its own data directory — the only one of the three reads below that is
  # per-app, and what the cross-app read assertion in
  # capability-enforcement.mjs Test 9 turns on.
  - filesystem:read:/workspace/.berth/dev-workspace/boundary-app-b
  # The code this app boots from. `node_modules/@berth/sdk` is a pnpm
  # symlink to /workspace/packages/sdk, and Landlock resolves symlinks to
  # the real inode — so without these the app cannot read its own entry
  # point and dies at startup with EACCES on
  # /workspace/packages/sdk/dist/runtime.js. That is invisible wherever
  # Landlock is inactive, which is why it only ever failed on CI.
  #
  # Code, not data: every fixture reads the same source tree, and the
  # isolation this test exists to prove is about each app's data
  # directory above.
  - filesystem:read:/workspace/packages
  - filesystem:read:/workspace/node_modules
  - filesystem:write:/workspace/.berth/dev-workspace/boundary-app-b

exports:
  - name: write_file
    input: { path: string, content: string }
  - name: read_file
    input: { path: string }
    output: { content: string }
  # Declares no app:invoke: capability on purpose — reaching a sibling's RPC
  # socket is what this export probes, and what REMEDIATION.md 1.4 refuses.
  - name: probe_unix_socket
    input: { path: string }
    output: { connected: boolean, code: string }
  - name: register_on_bus
    input: { app: string }
    output: { ok: boolean }
  - name: register_on_semantic_fs
    input: { app: string, pid: number }
    output: { ok: boolean }
  - name: send_oversized_frame
    input: { path: string }
    output: { ok: boolean }
  - name: invoke_via_socket
    input: { path: string, export: string, input: object }
    output: { response: string }

on_install: []
on_agent_ready: []
