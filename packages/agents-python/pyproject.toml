[project]
name = "berth-agents"
version = "0.1.0"
description = "computer -> agent -> tool, in Python: the provider-agnostic Agent tool-use loop, all six Crew composition shapes but networked, checkpointing, streaming, and structured-output repair, mirroring @berth/agents (no port of its Docker/Computer/tracing/retrieval/human-approval glue — see docs/agents-python-reference.md for scope)."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.110.0",
    "openai>=1.50.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "mcp>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["berth_agents*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
