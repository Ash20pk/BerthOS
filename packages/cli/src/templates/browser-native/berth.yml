name: {{name}}
version: 0.1.0

capabilities:
  - browser:navigate:*
  - browser:screenshot:*

exports:
  - name: navigate
    input: { url: string }
  - name: click
    input: { selector: string }
  - name: get_page_text
    output: { text: string }

on_install: []
on_agent_ready:
  - "register_with_context_bus"
