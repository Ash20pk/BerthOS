<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 770" width="1180" height="770" role="img" aria-label="libkrun spike: containers (C4 level 2)">
<title>libkrun spike: containers (C4 level 2)</title>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .ln { stroke: #57606a; }
  .bd { stroke: #8c959f; }
  .bl { fill: #57606a; }
  .ah { fill: #57606a; }
  .pill { fill: #f6f8fa; stroke: #d0d7de; }
  .pt { fill: #24292f; }
  @media (prefers-color-scheme: dark) {
    .ln { stroke: #8b949e; }
    .bd { stroke: #6e7681; }
    .bl { fill: #9198a1; }
    .ah { fill: #8b949e; }
    .pill { fill: #161b22; stroke: #30363d; }
    .pt { fill: #e6edf3; }
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
  <marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
</defs>
<rect x="30" y="40" width="240" height="440" rx="14" fill="none" class="bd" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="46" y="466" class="bl" font-size="13.5" font-weight="700">Host</text>
<text x="46" y="466" dx="36.4" class="bl" font-size="12">macOS</text>
<rect x="430" y="40" width="730" height="440" rx="14" fill="none" class="bd" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="446" y="466" class="bl" font-size="13.5" font-weight="700">Guest</text>
<text x="446" y="466" dx="44" class="bl" font-size="12">one microVM</text>
<path d="M150,190 L150,298" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="93.85" y="225" width="112.3" height="40" rx="6" class="pill"/>
<text x="150" y="237" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="150" dy="0">spawns; RPC</tspan>
<tspan x="150" dy="16" font-style="italic">[Unix socket]</tspan>
</text>
<path d="M255,370 L468,370" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="297.4" y="350" width="105.19999999999999" height="40" rx="6" class="pill"/>
<text x="350" y="362" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="350" dy="0">boots; RPC</tspan>
<tspan x="350" dy="16" font-style="italic">[vsock 5000]</tspan>
</text>
<path d="M585,300 L585,192" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="511.1" y="225" width="147.8" height="40" rx="6" class="pill"/>
<text x="585" y="237" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="585" dy="0">socat, one app per</tspan>
<tspan x="585" dy="16">connection [stdio]</tspan>
</text>
<path d="M700,370 L878,370" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="739.95" y="350" width="98.1" height="40" rx="6" class="pill"/>
<text x="789" y="362" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="789" dy="0">mounts</tspan>
<tspan x="789" dy="16" font-style="italic">[virtio-fs]</tspan>
</text>
<path d="M255,640 L468,640" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="302.3" y="620" width="119.39999999999999" height="40" rx="6" class="pill"/>
<text x="362" y="632" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="362" dy="0">apk, downloads</tspan>
<tspan x="362" dy="16" font-style="italic">[TCP over TSI]</tspan>
</text>
<rect x="45" y="70" width="210" height="120" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="150" y="96" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="150" font-size="15.5" font-weight="700">Host script</tspan>
<tspan x="150" dy="17" font-size="11.5" opacity="0.85">[Container: Node.js or shell]</tspan>
<tspan x="150" dy="20" font-size="12.5">boot-notes.mjs or</tspan>
<tspan x="150" dy="17" font-size="12.5">run-probe.sh: boots the VM,</tspan>
<tspan x="150" dy="17" font-size="12.5">calls the app</tspan>
</text>
<rect x="45" y="300" width="210" height="140" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="150" y="344.5" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="150" font-size="15.5" font-weight="700">berth-vmm</tspan>
<tspan x="150" dy="17" font-size="11.5" opacity="0.85">[Container: Rust, libkrun on HVF]</tspan>
<tspan x="150" dy="20" font-size="12.5">One VM per process: no NIC,</tspan>
<tspan x="150" dy="17" font-size="12.5">TSI off, one vsock port</tspan>
</text>
<rect x="470" y="70" width="230" height="120" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="585" y="104.5" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="585" font-size="15.5" font-weight="700">notes app</tspan>
<tspan x="585" dy="17" font-size="11.5" opacity="0.85">[Container: Node.js under agent-init]</tspan>
<tspan x="585" dy="20" font-size="12.5">node /app/runtime.mjs as uid</tspan>
<tspan x="585" dy="17" font-size="12.5">10000, Landlock and seccomp</tspan>
</text>
<rect x="880" y="70" width="250" height="120" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="1005" y="104.5" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="1005" font-size="15.5" font-weight="700">Guest kernel</tspan>
<tspan x="1005" dy="17" font-size="11.5" opacity="0.85">[Container: linux 6.12.109]</tspan>
<tspan x="1005" dy="20" font-size="12.5">Our config: Landlock on, no</tspan>
<tspan x="1005" dy="17" font-size="12.5">dummy0, no io_uring</tspan>
</text>
<rect x="470" y="300" width="230" height="140" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="585" y="336" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="585" font-size="15.5" font-weight="700">berth-init.sh</tspan>
<tspan x="585" dy="17" font-size="11.5" opacity="0.85">[Container: shell, as root]</tspan>
<tspan x="585" dy="20" font-size="12.5">Exec'd by init.krun (PID 1):</tspan>
<tspan x="585" dy="17" font-size="12.5">mounts, policy compile, socat</tspan>
<tspan x="585" dy="17" font-size="12.5">on vsock 5000</tspan>
</text>
<path d="M880,310 a125,10 0 0 0 250,0 v120 a125,10 0 0 1 -250,0 z" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<ellipse cx="1005" cy="310" rx="125" ry="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="1005" y="350.5" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="1005" font-size="15.5" font-weight="700">Root and app shares</tspan>
<tspan x="1005" dy="17" font-size="11.5" opacity="0.85">[virtio-fs, read-only]</tspan>
<tspan x="1005" dy="20" font-size="12.5">rootfs-notes as /, the app</tspan>
<tspan x="1005" dy="17" font-size="12.5">directory at /app</tspan>
</text>
<rect x="45" y="580" width="210" height="120" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="150" y="606" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="150" font-size="15.5" font-weight="700">Builder VMs</tspan>
<tspan x="150" dy="17" font-size="11.5" opacity="0.85">[Container: berth-vmm --tsi]</tspan>
<tspan x="150" dy="20" font-size="12.5">Build the kernel,</tspan>
<tspan x="150" dy="17" font-size="12.5">agent-init and the rootfs</tspan>
<tspan x="150" dy="17" font-size="12.5">in Alpine</tspan>
</text>
<rect x="470" y="580" width="230" height="120" rx="10" fill="#6b7280" stroke="#4b5563" stroke-width="1.5"/>
<text x="585" y="614.5" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="585" font-size="15.5" font-weight="700">Alpine CDN, kernel.org</tspan>
<tspan x="585" dy="17" font-size="11.5" opacity="0.85">[External System]</tspan>
<tspan x="585" dy="20" font-size="12.5">Packages, minirootfs and</tspan>
<tspan x="585" dy="17" font-size="12.5">kernel source</tspan>
</text>
<rect x="24" y="736" width="16" height="16" rx="4" fill="#438dd5" stroke="#3c7fc0"/>
<text x="46" y="748.5" font-size="12.5" class="bl">Container</text>
<rect x="117" y="736" width="16" height="16" rx="4" fill="#6b7280" stroke="#4b5563"/>
<text x="139" y="748.5" font-size="12.5" class="bl">External</text>
</svg>
