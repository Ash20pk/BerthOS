<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 770" width="1180" height="770" role="img" aria-label="Agent runtime: containers (C4 level 2)">
<title>Agent runtime: containers (C4 level 2)</title>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .ln { stroke: #57606a; }
  .bd { stroke: #8c959f; }
  .bl { fill: #57606a; }
  .ah { fill: #57606a; }
  .pill { fill: #f6f8fa; stroke: #d0d7de; }
  .pt { fill: #24292f; }
  @media (prefers-color-scheme: dark) {
    .ln { stroke: #8b949e; }
    .bd { stroke: #6e7681; }
    .bl { fill: #9198a1; }
    .ah { fill: #8b949e; }
    .pill { fill: #161b22; stroke: #30363d; }
    .pt { fill: #e6edf3; }
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
  <marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
</defs>
<rect x="380" y="470" width="310" height="235" rx="14" fill="none" class="bd" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="396" y="691" class="bl" font-size="13.5" font-weight="700">Computer</text>
<text x="396" y="691" dx="66.8" class="bl" font-size="12">one Docker container</text>
<path d="M750,105 L938,105" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="798.5" y="85" width="91" height="40" rx="6" class="pill"/>
<text x="844" y="97" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="844" dy="0">chat</tspan>
<tspan x="844" dy="16" font-style="italic">[HTTP API]</tspan>
</text>
<path d="M720,190 L720,355 L938,355" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="766.75" y="335" width="126.5" height="40" rx="6" class="pill"/>
<text x="830" y="347" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="830" dy="0">tools/call</tspan>
<tspan x="830" dy="16" font-style="italic">[stdio or HTTP]</tspan>
</text>
<path d="M430,115 L140,115 L140,268" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="186.25" y="95" width="197.5" height="40" rx="6" class="pill"/>
<text x="285" y="107" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="285" dy="0">run_task</tspan>
<tspan x="285" dy="16" font-style="italic">[docker exec or HTTP RPC]</tspan>
</text>
<path d="M500,190 L500,498" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="387.05" y="320" width="225.89999999999998" height="40" rx="6" class="pill"/>
<text x="500" y="332" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="500" dy="0">tool calls</tspan>
<tspan x="500" dy="16" font-style="italic">[stdio attach or docker exec]</tspan>
</text>
<path d="M240,585 L398,585" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="280.6" y="565" width="76.8" height="40" rx="6" class="pill"/>
<text x="319" y="577" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="319" dy="0">starts</tspan>
<tspan x="319" dy="16" font-style="italic">[Docker]</tspan>
</text>
<path d="M958,572 L672,572" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="723.35" y="552" width="183.29999999999998" height="40" rx="6" class="pill"/>
<text x="815" y="564" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="815" dy="0">POST /rpc, bearer token</tspan>
<tspan x="815" dy="16" font-style="italic">[HTTP RPC bridge]</tspan>
</text>
<rect x="430" y="40" width="320" height="150" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="590" y="89.5" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="590" font-size="15.5" font-weight="700">Your program</tspan>
<tspan x="590" dy="17" font-size="11.5" opacity="0.85">[Container: Node.js, @berthos/agents]</tspan>
<tspan x="590" dy="20" font-size="12.5">Agent loop, Crew, governance gate; holds</tspan>
<tspan x="590" dy="17" font-size="12.5">the Computer handle</tspan>
</text>
<rect x="940" y="40" width="220" height="135" rx="10" fill="#6b7280" stroke="#4b5563" stroke-width="1.5"/>
<text x="1050" y="82" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="1050" font-size="15.5" font-weight="700">LLM provider API</tspan>
<tspan x="1050" dy="17" font-size="11.5" opacity="0.85">[External System]</tspan>
<tspan x="1050" dy="20" font-size="12.5">Anthropic, OpenAI, Gemini,</tspan>
<tspan x="1050" dy="17" font-size="12.5">Azure, Bedrock, Ollama</tspan>
</text>
<rect x="940" y="290" width="220" height="130" rx="10" fill="#6b7280" stroke="#4b5563" stroke-width="1.5"/>
<text x="1050" y="329.5" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="1050" font-size="15.5" font-weight="700">MCP servers</tspan>
<tspan x="1050" dy="17" font-size="11.5" opacity="0.85">[External System]</tspan>
<tspan x="1050" dy="20" font-size="12.5">Run outside the sandbox, with</tspan>
<tspan x="1050" dy="17" font-size="12.5">no Landlock policy</tspan>
</text>
<rect x="30" y="270" width="220" height="145" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="140" y="317" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="140" font-size="15.5" font-weight="700">Networked peer</tspan>
<tspan x="140" dy="17" font-size="11.5" opacity="0.85">[Container: Docker, one per peer]</tspan>
<tspan x="140" dy="20" font-size="12.5">Its own apps and agent loop</tspan>
<tspan x="140" dy="17" font-size="12.5">in a &lt;name&gt;-agent-server app</tspan>
</text>
<rect x="30" y="520" width="210" height="130" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="135" y="559.5" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="135" font-size="15.5" font-weight="700">berth os up</tspan>
<tspan x="135" dy="17" font-size="11.5" opacity="0.85">[Container: berth CLI]</tspan>
<tspan x="135" dy="20" font-size="12.5">Boots a Computer once and</tspan>
<tspan x="135" dy="17" font-size="12.5">leaves it running</tspan>
</text>
<rect x="400" y="500" width="270" height="145" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="535" y="538.5" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="535" font-size="15.5" font-weight="700">Resident apps</tspan>
<tspan x="535" dy="17" font-size="11.5" opacity="0.85">[Container: Node.js or Python SDK]</tspan>
<tspan x="535" dy="20" font-size="12.5">Each under its own kernel-enforced</tspan>
<tspan x="535" dy="17" font-size="12.5">berth.yml policy. One can serve the</tspan>
<tspan x="535" dy="17" font-size="12.5">HTTP RPC bridge</tspan>
</text>
<rect x="960" y="510" width="200" height="125" rx="10" fill="#6b7280" stroke="#4b5563" stroke-width="1.5"/>
<text x="1060" y="547" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="1060" font-size="15.5" font-weight="700">Python or remote client</tspan>
<tspan x="1060" dy="17" font-size="11.5" opacity="0.85">[External System]</tspan>
<tspan x="1060" dy="20" font-size="12.5">berth_agents, or any HTTP</tspan>
<tspan x="1060" dy="17" font-size="12.5">client</tspan>
</text>
<rect x="24" y="736" width="16" height="16" rx="4" fill="#438dd5" stroke="#3c7fc0"/>
<text x="46" y="748.5" font-size="12.5" class="bl">Container</text>
<rect x="117" y="736" width="16" height="16" rx="4" fill="#6b7280" stroke="#4b5563"/>
<text x="139" y="748.5" font-size="12.5" class="bl">External</text>
</svg>
