<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" role="img" aria-label="Semantic FS: containers (C4 level 2)">
<title>Semantic FS: containers (C4 level 2)</title>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .ln { stroke: #57606a; }
  .bd { stroke: #8c959f; }
  .bl { fill: #57606a; }
  .ah { fill: #57606a; }
  .pill { fill: #f6f8fa; stroke: #d0d7de; }
  .pt { fill: #24292f; }
  @media (prefers-color-scheme: dark) {
    .ln { stroke: #8b949e; }
    .bd { stroke: #6e7681; }
    .bl { fill: #9198a1; }
    .ah { fill: #8b949e; }
    .pill { fill: #161b22; stroke: #30363d; }
    .pt { fill: #e6edf3; }
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
  <marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
</defs>
<rect x="20" y="30" width="300" height="270" rx="14" fill="none" class="bd" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="36" y="286" class="bl" font-size="13.5" font-weight="700">App container</text>

<rect x="620" y="30" width="320" height="270" rx="14" fill="none" class="bd" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="636" y="286" class="bl" font-size="13.5" font-weight="700">Sidecar container, per sandbox</text>

<path d="M290,110 L648,110" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="374.8" y="90" width="190.39999999999998" height="40" rx="6" class="pill"/>
<text x="470" y="102" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="470" dy="0">file reads and writes</tspan>
<tspan x="470" dy="16" font-style="italic">[FUSE mount at /context]</tspan>
</text>
<path d="M290,185 L648,185" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="389" y="165" width="162" height="40" rx="6" class="pill"/>
<text x="470" y="177" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="470" dy="0">register, tag, query</tspan>
<tspan x="470" dy="16" font-style="italic">[Unix socket]</tspan>
</text>
<path d="M862,225 L862,400" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="773.9" y="325" width="176.2" height="40" rx="6" class="pill"/>
<text x="862" y="337" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="862" dy="0">passes writes through,</tspan>
<tspan x="862" dy="16">updates the index</tspan>
</text>
<path d="M290,465 L648,465" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="413.85" y="445" width="112.3" height="40" rx="6" class="pill"/>
<text x="470" y="457" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="470" dy="0">archives both</tspan>
<tspan x="470" dy="16" font-style="italic">[tar]</tspan>
</text>
<rect x="50" y="60" width="240" height="165" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="170" y="108.5" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="170" font-size="15.5" font-weight="700">Resident app</tspan>
<tspan x="170" dy="17" font-size="11.5" opacity="0.85">[Container: Node.js or Python + SDK]</tspan>
<tspan x="170" dy="20" font-size="12.5">Writes files under /context;</tspan>
<tspan x="170" dy="17" font-size="12.5">tags and searches them. The SDK</tspan>
<tspan x="170" dy="17" font-size="12.5">computes the embeddings</tspan>
</text>
<rect x="650" y="60" width="240" height="165" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="770" y="108.5" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="770" font-size="15.5" font-weight="700">semantic-fs-daemon</tspan>
<tspan x="770" dy="17" font-size="11.5" opacity="0.85">[Container: Go, FUSE]</tspan>
<tspan x="770" dy="20" font-size="12.5">Serves /context and the control</tspan>
<tspan x="770" dy="17" font-size="12.5">socket. Holds CAP_SYS_ADMIN only</tspan>
<tspan x="770" dy="17" font-size="12.5">until mounted</tspan>
</text>
<path d="M650,410 a120,10 0 0 0 240,0 v110 a120,10 0 0 1 -240,0 z" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<ellipse cx="770" cy="410" rx="120" ry="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="770" y="445.5" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="770" font-size="15.5" font-weight="700">Backing store and index</tspan>
<tspan x="770" dy="17" font-size="11.5" opacity="0.85">[Data store: volume + SQLite]</tspan>
<tspan x="770" dy="20" font-size="12.5">The files behind /context; tags</tspan>
<tspan x="770" dy="17" font-size="12.5">and embeddings by path</tspan>
</text>
<rect x="50" y="400" width="240" height="130" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="170" y="439.5" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="170" font-size="15.5" font-weight="700">berth snapshot</tspan>
<tspan x="170" dy="17" font-size="11.5" opacity="0.85">[Container: berth CLI]</tspan>
<tspan x="170" dy="20" font-size="12.5">Captures the backing directory</tspan>
<tspan x="170" dy="17" font-size="12.5">and the index</tspan>
</text>
<rect x="24" y="566" width="16" height="16" rx="4" fill="#438dd5" stroke="#3c7fc0"/>
<text x="46" y="578.5" font-size="12.5" class="bl">Container</text>
</svg>
