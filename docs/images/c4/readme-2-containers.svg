<text x="250" y="462" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="250" dy="0">RPC to apps</tspan>
<tspan x="250" dy="16" font-style="italic">[stdio relay, docker exec]</tspan>
</text>
<path d="M460,410 L460,543" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
