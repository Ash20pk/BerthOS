<tspan x="460" dy="0">RPC to apps</tspan>
<tspan x="460" dy="16" font-style="italic">[vsock]</tspan>
</text>
<path d="M560,410 L560,460 L707,460 L707,543" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
