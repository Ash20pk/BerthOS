<tspan x="660" dy="0">publish / install</tspan>
<tspan x="660" dy="16" font-style="italic">[HTTP(S)]</tspan>
</text>
<path d="M565,750 L598,750" fill="none" class="ln" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<rect x="190" y="60" width="240" height="105" rx="10" fill="#08427b" stroke="#073b6f" stroke-width="1.5"/>
<circle cx="310" cy="38" r="20" fill="#08427b" stroke="#073b6f" stroke-width="1.5"/>
<text x="310" y="87" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="310" font-size="15.5" font-weight="700">Developer</tspan>
<tspan x="310" dy="17" font-size="11.5" opacity="0.85">[Person]</tspan>
<tspan x="310" dy="20" font-size="12.5">Runs berth init, dev, test,</tspan>
<tspan x="310" dy="17" font-size="12.5">deploy</tspan>
</text>
<rect x="500" y="60" width="240" height="105" rx="10" fill="#6b7280" stroke="#4b5563" stroke-width="1.5"/>
<text x="620" y="95.5" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="620" font-size="15.5" font-weight="700">AI agent</tspan>
<tspan x="620" dy="17" font-size="11.5" opacity="0.85">[Software System]</tspan>
<tspan x="620" dy="20" font-size="12.5">Any MCP client</tspan>
</text>
<rect x="300" y="270" width="330" height="140" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="465" y="306" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="465" font-size="15.5" font-weight="700">berth CLI</tspan>
<tspan x="465" dy="17" font-size="11.5" opacity="0.85">[Container: Node.js, @berthos/cli]</tspan>
<tspan x="465" dy="20" font-size="12.5">Every command. The MCP server, and the host</tspan>
<tspan x="465" dy="17" font-size="12.5">side of every sandbox: bundles apps, boots</tspan>
<tspan x="465" dy="17" font-size="12.5">and stops sandboxes</tspan>
</text>
<path d="M40,290 a85,10 0 0 0 170,0 v115 a85,10 0 0 1 -170,0 z" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<ellipse cx="125" cy="290" rx="85" ry="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="125" y="319.5" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="125" font-size="15.5" font-weight="700">Audit trail</tspan>
<tspan x="125" dy="17" font-size="11.5" opacity="0.85">[Data store: JSONL]</tspan>
<tspan x="125" dy="20" font-size="12.5">Hash-chained; one</tspan>
<tspan x="125" dy="17" font-size="12.5">record per tool call</tspan>
<tspan x="125" dy="17" font-size="12.5">and boot</tspan>
</text>
<rect x="65" y="545" width="230" height="160" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="180" y="591" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="180" font-size="15.5" font-weight="700">Container sandbox</tspan>
<tspan x="180" dy="17" font-size="11.5" opacity="0.85">[Container: Docker / Colima]</tspan>
<tspan x="180" dy="20" font-size="12.5">The default. Alpine image;</tspan>
<tspan x="180" dy="17" font-size="12.5">entrypoint.sh starts daemons</tspan>
<tspan x="180" dy="17" font-size="12.5">and apps</tspan>
</text>
<rect x="315" y="545" width="230" height="160" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="430" y="591" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="430" font-size="15.5" font-weight="700">microVM sandbox</tspan>
<tspan x="430" dy="17" font-size="11.5" opacity="0.85">[Container: berth-vmm, Rust + libkrun]</tspan>
<tspan x="430" dy="20" font-size="12.5">Pinned kernel and rootfs,</tspan>
<tspan x="430" dy="17" font-size="12.5">berth-init as PID 1, no</tspan>
<tspan x="430" dy="17" font-size="12.5">network device. --runtime vm</tspan>
</text>
<rect x="600" y="545" width="215" height="120" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="707.5" y="579.5" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="707.5" font-size="15.5" font-weight="700">Registry server</tspan>
<tspan x="707.5" dy="17" font-size="11.5" opacity="0.85">[Container: Node.js]</tspan>
<tspan x="707.5" dy="20" font-size="12.5">Publish, discover, install</tspan>
<tspan x="707.5" dy="17" font-size="12.5">resident apps. Optional</tspan>
</text>
<rect x="600" y="690" width="215" height="120" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="707.5" y="724.5" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="707.5" font-size="15.5" font-weight="700">Mesh coordinator</tspan>
<tspan x="707.5" dy="17" font-size="11.5" opacity="0.85">[Container: Node.js]</tspan>
<tspan x="707.5" dy="20" font-size="12.5">Introduces sandboxes on a</tspan>
<tspan x="707.5" dy="17" font-size="12.5">WireGuard mesh. Optional</tspan>
</text>
<rect x="870" y="280" width="210" height="120" rx="10" fill="#6b7280" stroke="#4b5563" stroke-width="1.5"/>
<text x="975" y="323" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="975" font-size="15.5" font-weight="700">Remote sandboxes</tspan>
<tspan x="975" dy="17" font-size="11.5" opacity="0.85">[External System]</tspan>
<tspan x="975" dy="20" font-size="12.5">E2B, Daytona, Kubernetes</tspan>
</text>
<rect x="24" y="866" width="16" height="16" rx="4" fill="#08427b" stroke="#073b6f"/>
<text x="46" y="878.5" font-size="12.5" class="bl">Person</text>
<rect x="96" y="866" width="16" height="16" rx="4" fill="#438dd5" stroke="#3c7fc0"/>
<text x="118" y="878.5" font-size="12.5" class="bl">Container</text>
<rect x="189" y="866" width="16" height="16" rx="4" fill="#6b7280" stroke="#4b5563"/>
<text x="211" y="878.5" font-size="12.5" class="bl">External system</text>
</svg>
