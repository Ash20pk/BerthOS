<rect x="532.4" y="185" width="105.19999999999999" height="40" rx="6" class="pill"/>
<text x="585" y="197" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="585" dy="0">tools/call</tspan>
<tspan x="585" dy="16" font-style="italic">[MCP, stdio]</tspan>
</text>
<path d="M298,347 L212,347" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="216.6" y="327" width="76.8" height="40" rx="6" class="pill"/>
<text x="255" y="339" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="255" dy="0">appends,</tspan>
<tspan x="255" dy="16">attests</tspan>
</text>
<path d="M630,340 L868,340" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="679.65" y="320" width="140.7" height="40" rx="6" class="pill"/>
<text x="750" y="332" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="750" dy="0">deploys through</tspan>
<tspan x="750" dy="16" font-style="italic">[deploy adapters]</tspan>
</text>
<path d="M380,410 L380,470 L180,470 L180,543" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
