<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 770" width="1160" height="770" role="img" aria-label="microVM image: containers (C4 level 2)">
<title>microVM image: containers (C4 level 2)</title>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .ln { stroke: #57606a; }
  .bd { stroke: #8c959f; }
  .bl { fill: #57606a; }
  .ah { fill: #57606a; }
  .pill { fill: #f6f8fa; stroke: #d0d7de; }
  .pt { fill: #24292f; }
  @media (prefers-color-scheme: dark) {
    .ln { stroke: #8b949e; }
    .bd { stroke: #6e7681; }
    .bl { fill: #9198a1; }
    .ah { fill: #8b949e; }
    .pill { fill: #161b22; stroke: #30363d; }
    .pt { fill: #e6edf3; }
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
  <marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
</defs>
<rect x="20" y="500" width="272" height="210" rx="14" fill="none" class="bd" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="36" y="696" class="bl" font-size="13.5" font-weight="700">Guest</text>

<path d="M280,120 L458,120" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="310.3" y="100" width="119.39999999999999" height="40" rx="6" class="pill"/>
<text x="370" y="112" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="370" dy="0">run_builder</tspan>
<tspan x="370" dy="16" font-style="italic">[VM or docker]</tspan>
</text>
<path d="M700,120 L878,120" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="719.65" y="100" width="140.7" height="40" rx="6" class="pill"/>
<text x="790" y="112" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="790" dy="0">apk add, tarballs</tspan>
<tspan x="790" dy="16" font-style="italic">[HTTPS]</tspan>
</text>
<path d="M160,290 L160,182" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="107.4" y="215" width="105.19999999999999" height="40" rx="6" class="pill"/>
<text x="160" y="227" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="160" dy="0">runs the</tspan>
<tspan x="160" dy="16">same scripts</tspan>
</text>
<path d="M280,355 L458,355" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="303.2" y="335" width="133.6" height="40" rx="6" class="pill"/>
<text x="370" y="347" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="370" dy="0">publishes</tspan>
<tspan x="370" dy="16" font-style="italic">[GitHub release]</tspan>
</text>
<path d="M880,355 L702,355" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="719.65" y="335" width="140.7" height="40" rx="6" class="pill"/>
<text x="790" y="347" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="790" dy="0">downloads, checks</tspan>
<tspan x="790" dy="16">sha256 [HTTPS]</tspan>
</text>
<path d="M1000,420 L1000,528" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="947.4" y="455" width="105.19999999999999" height="40" rx="6" class="pill"/>
<text x="1000" y="467" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="1000" dy="0">renames into</tspan>
<tspan x="1000" dy="16">place</tspan>
</text>
<path d="M700,600 L878,600" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="726.75" y="580" width="126.5" height="40" rx="6" class="pill"/>
<text x="790" y="592" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="790" dy="0">reads, verifies</tspan>
<tspan x="790" dy="16">the pins</tspan>
</text>
<path d="M460,600 L282,600" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="307.2" y="580" width="133.6" height="40" rx="6" class="pill"/>
<text x="374" y="592" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="374" dy="0">boots: vda, vdb,</tspan>
<tspan x="374" dy="16">app share</tspan>
</text>
<rect x="40" y="60" width="240" height="120" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="160" y="86" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="160" font-size="15.5" font-weight="700">Build scripts</tspan>
<tspan x="160" dy="17" font-size="11.5" opacity="0.85">[Container: shell, packages/vmm/scripts]</tspan>
<tspan x="160" dy="20" font-size="12.5">build-kernel.sh, build-rootfs.sh</tspan>
<tspan x="160" dy="17" font-size="12.5">and the guest builds; hash each</tspan>
<tspan x="160" dy="17" font-size="12.5">output</tspan>
</text>
<rect x="460" y="60" width="240" height="120" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="580" y="94.5" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="580" font-size="15.5" font-weight="700">Builder</tspan>
<tspan x="580" dy="17" font-size="11.5" opacity="0.85">[Container: libkrun VM or Docker]</tspan>
<tspan x="580" dy="20" font-size="12.5">Fresh Alpine 3.24.2 root from</tspan>
<tspan x="580" dy="17" font-size="12.5">the pinned minirootfs</tspan>
</text>
<rect x="880" y="60" width="240" height="120" rx="10" fill="#6b7280" stroke="#4b5563" stroke-width="1.5"/>
<text x="1000" y="94.5" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="1000" font-size="15.5" font-weight="700">Alpine, kernel.org</tspan>
<tspan x="1000" dy="17" font-size="11.5" opacity="0.85">[External System]</tspan>
<tspan x="1000" dy="20" font-size="12.5">Packages, linux and libkrunfw</tspan>
<tspan x="1000" dy="17" font-size="12.5">tarballs</tspan>
</text>
<rect x="40" y="290" width="240" height="130" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="160" y="329.5" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="160" font-size="15.5" font-weight="700">CI workflow</tspan>
<tspan x="160" dy="17" font-size="11.5" opacity="0.85">[Container: GitHub Actions]</tspan>
<tspan x="160" dy="20" font-size="12.5">vm-artifacts.yml: rebuilds,</tspan>
<tspan x="160" dy="17" font-size="12.5">checks every pin</tspan>
</text>
<rect x="460" y="290" width="240" height="130" rx="10" fill="#6b7280" stroke="#4b5563" stroke-width="1.5"/>
<text x="580" y="329.5" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="580" font-size="15.5" font-weight="700">GitHub release</tspan>
<tspan x="580" dy="17" font-size="11.5" opacity="0.85">[External System]</tspan>
<tspan x="580" dy="20" font-size="12.5">vm-artifacts-&lt;kernel8&gt;-&lt;rootfs8&gt;,</tspan>
<tspan x="580" dy="17" font-size="12.5">assets named by sha256</tspan>
</text>
<rect x="880" y="290" width="240" height="130" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="1000" y="329.5" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="1000" font-size="15.5" font-weight="700">berth vm install</tspan>
<tspan x="1000" dy="17" font-size="11.5" opacity="0.85">[Container: Node.js, berth CLI]</tspan>
<tspan x="1000" dy="20" font-size="12.5">Takes the pins from berth-vmm,</tspan>
<tspan x="1000" dy="17" font-size="12.5">downloads and checks each asset</tspan>
</text>
<rect x="40" y="530" width="240" height="140" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="160" y="566" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="160" font-size="15.5" font-weight="700">Guest init</tspan>
<tspan x="160" dy="17" font-size="11.5" opacity="0.85">[Container: /sbin/berth-init]</tspan>
<tspan x="160" dy="20" font-size="12.5">Mounts the state disk and /app,</tspan>
<tspan x="160" dy="17" font-size="12.5">writes identities, serves the</tspan>
<tspan x="160" dy="17" font-size="12.5">vsock ports</tspan>
</text>
<rect x="460" y="530" width="240" height="140" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="580" y="566" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="580" font-size="15.5" font-weight="700">berth-vmm</tspan>
<tspan x="580" dy="17" font-size="11.5" opacity="0.85">[Container: Rust, libkrun on HVF]</tspan>
<tspan x="580" dy="20" font-size="12.5">Refuses a kernel or rootfs that</tspan>
<tspan x="580" dy="17" font-size="12.5">does not match its compiled-in</tspan>
<tspan x="580" dy="17" font-size="12.5">pins</tspan>
</text>
<path d="M880,540 a120,10 0 0 0 240,0 v120 a120,10 0 0 1 -240,0 z" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<ellipse cx="1000" cy="540" rx="120" ry="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="1000" y="580.5" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="1000" font-size="15.5" font-weight="700">Artifacts directory</tspan>
<tspan x="1000" dy="17" font-size="11.5" opacity="0.85">[~/.berth/vm]</tspan>
<tspan x="1000" dy="20" font-size="12.5">kernel/sha256/&lt;pin&gt;/Image,</tspan>
<tspan x="1000" dy="17" font-size="12.5">rootfs/rootfs-&lt;pin&gt;.erofs</tspan>
</text>
<rect x="24" y="736" width="16" height="16" rx="4" fill="#438dd5" stroke="#3c7fc0"/>
<text x="46" y="748.5" font-size="12.5" class="bl">Container</text>
<rect x="117" y="736" width="16" height="16" rx="4" fill="#6b7280" stroke="#4b5563"/>
<text x="139" y="748.5" font-size="12.5" class="bl">External</text>
</svg>
