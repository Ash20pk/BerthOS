<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 590" width="1130" height="590" role="img" aria-label="Several apps in one sandbox: containers (C4 level 2)">
<title>Several apps in one sandbox: containers (C4 level 2)</title>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .ln { stroke: #57606a; }
  .bd { stroke: #8c959f; }
  .bl { fill: #57606a; }
  .ah { fill: #57606a; }
  .pill { fill: #f6f8fa; stroke: #d0d7de; }
  .pt { fill: #24292f; }
  @media (prefers-color-scheme: dark) {
    .ln { stroke: #8b949e; }
    .bd { stroke: #6e7681; }
    .bl { fill: #9198a1; }
    .ah { fill: #8b949e; }
    .pill { fill: #161b22; stroke: #30363d; }
    .pt { fill: #e6edf3; }
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
  <marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
</defs>
<rect x="20" y="30" width="260" height="210" rx="14" fill="none" class="bd" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="36" y="226" class="bl" font-size="13.5" font-weight="700">Host</text>

<rect x="440" y="30" width="670" height="480" rx="14" fill="none" class="bd" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="456" y="496" class="bl" font-size="13.5" font-weight="700">Sandbox container</text>
<text x="456" y="496" dx="135.2" class="bl" font-size="12">berth-dev-&lt;primary&gt;</text>
<path d="M260,122 L468,122" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="300.3" y="102" width="119.39999999999999" height="40" rx="6" class="pill"/>
<text x="360" y="114" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="360" dy="0">docker exec</tspan>
<tspan x="360" dy="16" font-style="italic">[stdin/stdout]</tspan>
</text>
<path d="M580,185 L580,328" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="502.55" y="237" width="154.9" height="40" rx="6" class="pill"/>
<text x="580" y="249" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="580" dy="0">rpc.sock</tspan>
<tspan x="580" dy="16" font-style="italic">[Unix socket, 0600]</tspan>
</text>
<path d="M870,397 L692,397" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="713.2" y="377" width="133.6" height="40" rx="6" class="pill"/>
<text x="780" y="389" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="780" dy="0">peers/B/rpc.sock</tspan>
<tspan x="780" dy="16" font-style="italic">[app:invoke]</tspan>
</text>
<path d="M690,350 L760,350 L760,140 L868,140" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="686.1" y="242" width="147.8" height="40" rx="6" class="pill"/>
<text x="760" y="254" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="760" dy="0">publish, subscribe</tspan>
<tspan x="760" dy="16" font-style="italic">[Unix socket]</tspan>
</text>
<path d="M980,330 L980,187" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="906.1" y="237" width="147.8" height="40" rx="6" class="pill"/>
<text x="980" y="249" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="980" dy="0">publish, subscribe</tspan>
<tspan x="980" dy="16" font-style="italic">[Unix socket]</tspan>
</text>
<rect x="40" y="60" width="220" height="125" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="150" y="97" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="150" font-size="15.5" font-weight="700">berth rpc</tspan>
<tspan x="150" dy="17" font-size="11.5" opacity="0.85">[Container: CLI, or Computer.connect()]</tspan>
<tspan x="150" dy="20" font-size="12.5">Calls one app's export from</tspan>
<tspan x="150" dy="17" font-size="12.5">outside</tspan>
</text>
<rect x="470" y="60" width="220" height="125" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="580" y="97" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="580" font-size="15.5" font-weight="700">RPC relay</tspan>
<tspan x="580" dy="17" font-size="11.5" opacity="0.85">[Container: Node.js, via docker exec]</tspan>
<tspan x="580" dy="20" font-size="12.5">Pipes stdin and stdout to one</tspan>
<tspan x="580" dy="17" font-size="12.5">app's socket, as root</tspan>
</text>
<rect x="870" y="60" width="220" height="125" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="980" y="105.5" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="980" font-size="15.5" font-weight="700">Context bus daemon</tspan>
<tspan x="980" dy="17" font-size="11.5" opacity="0.85">[Container: Rust]</tspan>
<tspan x="980" dy="20" font-size="12.5">Pub/sub between the apps</tspan>
</text>
<rect x="470" y="330" width="220" height="135" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="580" y="372" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="580" font-size="15.5" font-weight="700">App A</tspan>
<tspan x="580" dy="17" font-size="11.5" opacity="0.85">[Container: agent-init, uid 10000]</tspan>
<tspan x="580" dy="20" font-size="12.5">Own Landlock ruleset; serves</tspan>
<tspan x="580" dy="17" font-size="12.5">/run/berth/A/rpc.sock</tspan>
</text>
<rect x="870" y="330" width="220" height="135" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="980" y="372" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="980" font-size="15.5" font-weight="700">App B</tspan>
<tspan x="980" dy="17" font-size="11.5" opacity="0.85">[Container: agent-init, uid 10001]</tspan>
<tspan x="980" dy="20" font-size="12.5">Own Landlock ruleset;</tspan>
<tspan x="980" dy="17" font-size="12.5">declares app:invoke:A</tspan>
</text>
<rect x="24" y="556" width="16" height="16" rx="4" fill="#438dd5" stroke="#3c7fc0"/>
<text x="46" y="568.5" font-size="12.5" class="bl">Container</text>
</svg>
