<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" width="1080" height="720" role="img" aria-label="Mesh networking: containers (C4 level 2)">
<title>Mesh networking: containers (C4 level 2)</title>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .ln { stroke: #57606a; }
  .bd { stroke: #8c959f; }
  .bl { fill: #57606a; }
  .ah { fill: #57606a; }
  .pill { fill: #f6f8fa; stroke: #d0d7de; }
  .pt { fill: #24292f; }
  @media (prefers-color-scheme: dark) {
    .ln { stroke: #8b949e; }
    .bd { stroke: #6e7681; }
    .bl { fill: #9198a1; }
    .ah { fill: #8b949e; }
    .pill { fill: #161b22; stroke: #30363d; }
    .pt { fill: #e6edf3; }
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
  <marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
</defs>
<rect x="20" y="30" width="320" height="390" rx="14" fill="none" class="bd" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="36" y="406" class="bl" font-size="13.5" font-weight="700">Sandbox container</text>
<text x="36" y="406" dx="135.2" class="bl" font-size="12">berth-dev-planner</text>
<rect x="720" y="30" width="320" height="390" rx="14" fill="none" class="bd" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="736" y="406" class="bl" font-size="13.5" font-weight="700">Sandbox container</text>
<text x="736" y="406" dx="135.2" class="bl" font-size="12">berth-dev-browser</text>
<rect x="370" y="480" width="320" height="190" rx="14" fill="none" class="bd" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="386" y="656" class="bl" font-size="13.5" font-weight="700">Host</text>

<path d="M310,120 L748,120" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="434.8" y="100" width="190.39999999999998" height="40" rx="6" class="pill"/>
<text x="530" y="112" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="530" dy="0">connects to mesh IP:port</tspan>
<tspan x="530" dy="16" font-style="italic">[TCP over wg0]</tspan>
</text>
<path d="M312,320 L748,320" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
<rect x="463.2" y="300" width="133.6" height="40" rx="6" class="pill"/>
<text x="530" y="312" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="530" dy="0">WireGuard tunnel</tspan>
<tspan x="530" dy="16" font-style="italic">[UDP 51820]</tspan>
</text>
<path d="M290,380 L290,567 L398,567" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="212.55" y="435" width="154.9" height="40" rx="6" class="pill"/>
<text x="290" y="447" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="290" dy="0">register, roster</tspan>
<tspan x="290" dy="16">every 5 s [HTTP(S)]</tspan>
</text>
<path d="M990,380 L990,567 L662,567" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="912.55" y="435" width="154.9" height="40" rx="6" class="pill"/>
<text x="990" y="447" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="990" dy="0">register, roster</tspan>
<tspan x="990" dy="16">every 5 s [HTTP(S)]</tspan>
</text>
<rect x="50" y="60" width="260" height="120" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="180" y="94.5" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="180" font-size="15.5" font-weight="700">Resident app</tspan>
<tspan x="180" dy="17" font-size="11.5" opacity="0.85">[Container: Node.js or Python]</tspan>
<tspan x="180" dy="20" font-size="12.5">Declares</tspan>
<tspan x="180" dy="17" font-size="12.5">network:peer:berth-dev-browser</tspan>
</text>
<rect x="50" y="260" width="260" height="120" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="180" y="294.5" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="180" font-size="15.5" font-weight="700">mesh-daemon</tspan>
<tspan x="180" dy="17" font-size="11.5" opacity="0.85">[Container: Rust, root + NET_ADMIN]</tspan>
<tspan x="180" dy="20" font-size="12.5">Owns the key pair and wg0; applies</tspan>
<tspan x="180" dy="17" font-size="12.5">the roster</tspan>
</text>
<rect x="750" y="60" width="260" height="120" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="880" y="86" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="880" font-size="15.5" font-weight="700">Resident app</tspan>
<tspan x="880" dy="17" font-size="11.5" opacity="0.85">[Container: Node.js or Python]</tspan>
<tspan x="880" dy="20" font-size="12.5">Declares</tspan>
<tspan x="880" dy="17" font-size="12.5">network:peer:berth-dev-planner and</tspan>
<tspan x="880" dy="17" font-size="12.5">network:bind:9000</tspan>
</text>
<rect x="750" y="260" width="260" height="120" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="880" y="294.5" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="880" font-size="15.5" font-weight="700">mesh-daemon</tspan>
<tspan x="880" dy="17" font-size="11.5" opacity="0.85">[Container: Rust, root + NET_ADMIN]</tspan>
<tspan x="880" dy="20" font-size="12.5">Owns the key pair and wg0; applies</tspan>
<tspan x="880" dy="17" font-size="12.5">the roster</tspan>
</text>
<rect x="400" y="505" width="260" height="125" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="530" y="542" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="530" font-size="15.5" font-weight="700">mesh-coordinator</tspan>
<tspan x="530" dy="17" font-size="11.5" opacity="0.85">[Container: Node.js, SQLite, :4875]</tspan>
<tspan x="530" dy="20" font-size="12.5">Hands out mesh IPs, stores public</tspan>
<tspan x="530" dy="17" font-size="12.5">keys, matches patterns both ways</tspan>
</text>
<rect x="24" y="686" width="16" height="16" rx="4" fill="#438dd5" stroke="#3c7fc0"/>
<text x="46" y="698.5" font-size="12.5" class="bl">Container</text>
</svg>
