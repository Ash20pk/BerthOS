<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560" role="img" aria-label="microVM layers: containers (C4 level 2)">
<title>microVM layers: containers (C4 level 2)</title>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .ln { stroke: #57606a; }
  .bd { stroke: #8c959f; }
  .bl { fill: #57606a; }
  .ah { fill: #57606a; }
  .pill { fill: #f6f8fa; stroke: #d0d7de; }
  .pt { fill: #24292f; }
  @media (prefers-color-scheme: dark) {
    .ln { stroke: #8b949e; }
    .bd { stroke: #6e7681; }
    .bl { fill: #9198a1; }
    .ah { fill: #8b949e; }
    .pill { fill: #161b22; stroke: #30363d; }
    .pt { fill: #e6edf3; }
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
  <marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
</defs>
<rect x="20" y="30" width="300" height="470" rx="14" fill="none" class="bd" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="36" y="486" class="bl" font-size="13.5" font-weight="700">Host</text>

<rect x="420" y="290" width="740" height="210" rx="14" fill="none" class="bd" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="436" y="486" class="bl" font-size="13.5" font-weight="700">Guest</text>
<text x="436" y="486" dx="44" class="bl" font-size="12">microVM</text>
<path d="M300,122 L458,122" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="315.75" y="102" width="126.5" height="40" rx="6" class="pill"/>
<text x="379" y="114" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="379" dy="0">downloads once,</tspan>
<tspan x="379" dy="16">checks the pin</tspan>
</text>
<path d="M170,185 L170,328" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="96.1" y="245" width="147.8" height="24" rx="6" class="pill"/>
<text x="170" y="257" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="170" dy="0">run --layer &lt;name&gt;</tspan>
</text>
<path d="M300,392 L458,392" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="326.4" y="372" width="105.19999999999999" height="40" rx="6" class="pill"/>
<text x="379" y="384" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="379" dy="0">read-only</tspan>
<tspan x="379" dy="16" font-style="italic">[virtio-blk]</tspan>
</text>
<path d="M720,392 L878,392" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="757.05" y="380" width="83.9" height="24" rx="6" class="pill"/>
<text x="799" y="392" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="799" dy="0">starts it</tspan>
</text>
<rect x="40" y="60" width="260" height="125" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="170" y="97" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="170" font-size="15.5" font-weight="700">berth CLI</tspan>
<tspan x="170" dy="17" font-size="11.5" opacity="0.85">[Container: Node.js]</tspan>
<tspan x="170" dy="20" font-size="12.5">Works out which layers the apps'</tspan>
<tspan x="170" dy="17" font-size="12.5">manifests need</tspan>
</text>
<rect x="460" y="60" width="260" height="125" rx="10" fill="#6b7280" stroke="#4b5563" stroke-width="1.5"/>
<text x="590" y="97" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="590" font-size="15.5" font-weight="700">vm-artifacts release</tspan>
<tspan x="590" dy="17" font-size="11.5" opacity="0.85">[External System]</tspan>
<tspan x="590" dy="20" font-size="12.5">Carries layer-&lt;name&gt;-&lt;sha&gt;.erofs</tspan>
<tspan x="590" dy="17" font-size="12.5">next to the kernel and rootfs</tspan>
</text>
<rect x="40" y="330" width="260" height="125" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="170" y="367" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="170" font-size="15.5" font-weight="700">berth-vmm</tspan>
<tspan x="170" dy="17" font-size="11.5" opacity="0.85">[Container: Rust + libkrun]</tspan>
<tspan x="170" dy="20" font-size="12.5">Checks each layer against its pin</tspan>
<tspan x="170" dy="17" font-size="12.5">and base; attaches it read-only</tspan>
</text>
<rect x="460" y="330" width="260" height="125" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="590" y="358.5" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="590" font-size="15.5" font-weight="700">berth-init</tspan>
<tspan x="590" dy="17" font-size="11.5" opacity="0.85">[Container: Rust, PID 1]</tspan>
<tspan x="590" dy="20" font-size="12.5">Mounts each layer and lays its</tspan>
<tspan x="590" dy="17" font-size="12.5">directories over the base</tspan>
<tspan x="590" dy="17" font-size="12.5">(overlayfs)</tspan>
</text>
<rect x="880" y="330" width="260" height="125" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="1010" y="367" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="1010" font-size="15.5" font-weight="700">Display stack</tspan>
<tspan x="1010" dy="17" font-size="11.5" opacity="0.85">[Container: Xvfb, x11vnc, websockify]</tspan>
<tspan x="1010" dy="20" font-size="12.5">Under agent-init, for an app that</tspan>
<tspan x="1010" dy="17" font-size="12.5">declares browser:*</tspan>
</text>
<rect x="24" y="526" width="16" height="16" rx="4" fill="#438dd5" stroke="#3c7fc0"/>
<text x="46" y="538.5" font-size="12.5" class="bl">Container</text>
<rect x="117" y="526" width="16" height="16" rx="4" fill="#6b7280" stroke="#4b5563"/>
<text x="139" y="538.5" font-size="12.5" class="bl">External</text>
</svg>
