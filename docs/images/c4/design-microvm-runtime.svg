<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 950" width="1180" height="950" role="img" aria-label="microVM runtime: containers (C4 level 2)">
<title>microVM runtime: containers (C4 level 2)</title>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .ln { stroke: #57606a; }
  .bd { stroke: #8c959f; }
  .bl { fill: #57606a; }
  .ah { fill: #57606a; }
  .pill { fill: #f6f8fa; stroke: #d0d7de; }
  .pt { fill: #24292f; }
  @media (prefers-color-scheme: dark) {
    .ln { stroke: #8b949e; }
    .bd { stroke: #6e7681; }
    .bl { fill: #9198a1; }
    .ah { fill: #8b949e; }
    .pill { fill: #161b22; stroke: #30363d; }
    .pt { fill: #e6edf3; }
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
  <marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
</defs>
<rect x="30" y="240" width="240" height="470" rx="14" fill="none" class="bd" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="46" y="696" class="bl" font-size="13.5" font-weight="700">Host</text>
<text x="46" y="696" dx="36.4" class="bl" font-size="12">macOS</text>
<rect x="430" y="240" width="730" height="470" rx="14" fill="none" class="bd" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="446" y="696" class="bl" font-size="13.5" font-weight="700">Guest</text>
<text x="446" y="696" dx="44" class="bl" font-size="12">one microVM per sandbox</text>
<path d="M150,170 L150,268" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="86.75" y="185" width="126.5" height="40" rx="6" class="pill"/>
<text x="150" y="197" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="150" dy="0">berth dev / mcp</tspan>
<tspan x="150" dy="16">--runtime vm</tspan>
</text>
<path d="M150,410 L150,518" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="76.1" y="437" width="147.8" height="56" rx="6" class="pill"/>
<text x="150" y="449" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="150" dy="0">spawns, then</tspan>
<tspan x="150" dy="16">control, logs, RPC</tspan>
<tspan x="150" dy="16" font-style="italic">[Unix sockets]</tspan>
</text>
<path d="M255,570 L468,570" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="276.1" y="550" width="147.8" height="40" rx="6" class="pill"/>
<text x="350" y="562" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="350" dy="0">control, logs, RPC</tspan>
<tspan x="350" dy="16" font-style="italic">[vsock]</tspan>
</text>
<path d="M470,635 L257,635" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="297.4" y="615" width="105.19999999999999" height="40" rx="6" class="pill"/>
<text x="350" y="627" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="350" dy="0">egress relay</tspan>
<tspan x="350" dy="16" font-style="italic">[vsock 1026]</tspan>
</text>
<path d="M585,520 L585,412" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="528.85" y="445" width="112.3" height="40" rx="6" class="pill"/>
<text x="585" y="457" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="585" dy="0">RPC relay</tspan>
<tspan x="585" dy="16" font-style="italic">[Unix socket]</tspan>
</text>
<path d="M700,340 L878,340" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
<rect x="732.85" y="320" width="112.3" height="40" rx="6" class="pill"/>
<text x="789" y="332" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="789" dy="0">events</tspan>
<tspan x="789" dy="16" font-style="italic">[Unix socket]</tspan>
</text>
<path d="M700,595 L878,595" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="715.1" y="575" width="147.8" height="40" rx="6" class="pill"/>
<text x="789" y="587" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="789" dy="0">mounts</tspan>
<tspan x="789" dy="16" font-style="italic">[block, virtio-fs]</tspan>
</text>
<path d="M150,670 L150,788" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="76.1" y="730" width="147.8" height="40" rx="6" class="pill"/>
<text x="150" y="742" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="150" dy="0">allowed hosts only</tspan>
<tspan x="150" dy="16" font-style="italic">[TCP]</tspan>
</text>
<rect x="45" y="70" width="210" height="100" rx="10" fill="#08427b" stroke="#073b6f" stroke-width="1.5"/>
<circle cx="150" cy="48" r="20" fill="#08427b" stroke="#073b6f" stroke-width="1.5"/>
<text x="150" y="94.5" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="150" font-size="15.5" font-weight="700">Developer</tspan>
<tspan x="150" dy="17" font-size="11.5" opacity="0.85">[Person]</tspan>
<tspan x="150" dy="20" font-size="12.5">Runs berth dev or berth mcp</tspan>
<tspan x="150" dy="17" font-size="12.5">with --runtime vm</tspan>
</text>
<rect x="45" y="270" width="210" height="140" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="150" y="297.5" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="150" font-size="15.5" font-weight="700">berth CLI</tspan>
<tspan x="150" dy="17" font-size="11.5" opacity="0.85">[Container: Node.js]</tspan>
<tspan x="150" dy="20" font-size="12.5">packages/cli/src/vm:</tspan>
<tspan x="150" dy="17" font-size="12.5">bundles the app, installs</tspan>
<tspan x="150" dy="17" font-size="12.5">the pinned artifacts, waits</tspan>
<tspan x="150" dy="17" font-size="12.5">for app_ready</tspan>
</text>
<rect x="45" y="520" width="210" height="150" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="150" y="544" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="150" font-size="15.5" font-weight="700">berth-vmm</tspan>
<tspan x="150" dy="17" font-size="11.5" opacity="0.85">[Container: Rust, libkrun on HVF]</tspan>
<tspan x="150" dy="20" font-size="12.5">Checks the kernel and</tspan>
<tspan x="150" dy="17" font-size="12.5">rootfs pins, maps vsock</tspan>
<tspan x="150" dy="17" font-size="12.5">ports to Unix sockets, runs</tspan>
<tspan x="150" dy="17" font-size="12.5">the egress dialer, under</tspan>
<tspan x="150" dy="17" font-size="12.5">Seatbelt</tspan>
</text>
<rect x="45" y="790" width="210" height="100" rx="10" fill="#6b7280" stroke="#4b5563" stroke-width="1.5"/>
<text x="150" y="814.5" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="150" font-size="15.5" font-weight="700">Internet hosts</tspan>
<tspan x="150" dy="17" font-size="11.5" opacity="0.85">[External System]</tspan>
<tspan x="150" dy="20" font-size="12.5">Only the hosts the apps</tspan>
<tspan x="150" dy="17" font-size="12.5">declare</tspan>
</text>
<rect x="470" y="270" width="230" height="140" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="585" y="314.5" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="585" font-size="15.5" font-weight="700">App</tspan>
<tspan x="585" dy="17" font-size="11.5" opacity="0.85">[Container: Node.js under agent-init]</tspan>
<tspan x="585" dy="20" font-size="12.5">uid 10000+i, its own cgroup,</tspan>
<tspan x="585" dy="17" font-size="12.5">Landlock and seccomp</tspan>
</text>
<rect x="880" y="270" width="250" height="140" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="1005" y="314.5" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="1005" font-size="15.5" font-weight="700">context-bus-daemon</tspan>
<tspan x="1005" dy="17" font-size="11.5" opacity="0.85">[Container: Rust, uid 9001]</tspan>
<tspan x="1005" dy="20" font-size="12.5">Confined by agent-init; registers</tspan>
<tspan x="1005" dy="17" font-size="12.5">each app by its peer identity</tspan>
</text>
<rect x="470" y="520" width="230" height="150" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="585" y="561" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="585" font-size="15.5" font-weight="700">berth-init</tspan>
<tspan x="585" dy="17" font-size="11.5" opacity="0.85">[Container: Rust, PID 1]</tspan>
<tspan x="585" dy="20" font-size="12.5">Mounts, cgroups, policy</tspan>
<tspan x="585" dy="17" font-size="12.5">compile, identities; starts</tspan>
<tspan x="585" dy="17" font-size="12.5">the daemons and apps</tspan>
</text>
<path d="M880,530 a125,10 0 0 0 250,0 v130 a125,10 0 0 1 -250,0 z" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<ellipse cx="1005" cy="530" rx="125" ry="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="1005" y="575.5" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="1005" font-size="15.5" font-weight="700">Disks and share</tspan>
<tspan x="1005" dy="17" font-size="11.5" opacity="0.85">[virtio-blk, virtio-fs]</tspan>
<tspan x="1005" dy="20" font-size="12.5">vda erofs rootfs (ro), vdb ext4</tspan>
<tspan x="1005" dy="17" font-size="12.5">state disk, app share (ro)</tspan>
</text>
<rect x="24" y="916" width="16" height="16" rx="4" fill="#08427b" stroke="#073b6f"/>
<text x="46" y="928.5" font-size="12.5" class="bl">Person</text>
<rect x="96" y="916" width="16" height="16" rx="4" fill="#438dd5" stroke="#3c7fc0"/>
<text x="118" y="928.5" font-size="12.5" class="bl">Container</text>
<rect x="189" y="916" width="16" height="16" rx="4" fill="#6b7280" stroke="#4b5563"/>
<text x="211" y="928.5" font-size="12.5" class="bl">External</text>
</svg>
