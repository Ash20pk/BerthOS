<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560" role="img" aria-label="berth-init: containers (C4 level 2)">
<title>berth-init: containers (C4 level 2)</title>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .ln { stroke: #57606a; }
  .bd { stroke: #8c959f; }
  .bl { fill: #57606a; }
  .ah { fill: #57606a; }
  .pill { fill: #f6f8fa; stroke: #d0d7de; }
  .pt { fill: #24292f; }
  @media (prefers-color-scheme: dark) {
    .ln { stroke: #8b949e; }
    .bd { stroke: #6e7681; }
    .bl { fill: #9198a1; }
    .ah { fill: #8b949e; }
    .pill { fill: #161b22; stroke: #30363d; }
    .pt { fill: #e6edf3; }
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
  <marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
</defs>
<rect x="20" y="30" width="280" height="470" rx="14" fill="none" class="bd" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="36" y="486" class="bl" font-size="13.5" font-weight="700">Host</text>

<rect x="380" y="30" width="780" height="470" rx="14" fill="none" class="bd" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="396" y="486" class="bl" font-size="13.5" font-weight="700">Guest</text>
<text x="396" y="486" dx="44" class="bl" font-size="12">microVM, no NIC</text>
<path d="M160,185 L160,328" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="100.30000000000001" y="237" width="119.39999999999999" height="40" rx="6" class="pill"/>
<text x="160" y="249" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="160" dy="0">connects</tspan>
<tspan x="160" dy="16" font-style="italic">[Unix sockets]</tspan>
</text>
<path d="M280,392 L418,392" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="289.3" y="372" width="119.39999999999999" height="40" rx="6" class="pill"/>
<text x="349" y="384" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="349" dy="0">1024, 1025,</tspan>
<tspan x="349" dy="16">5000+i [vsock]</tspan>
</text>
<path d="M660,392 L878,392" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="684.45" y="372" width="169.1" height="40" rx="6" class="pill"/>
<text x="769" y="384" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="769" dy="0">starts it, relays RPC</tspan>
<tspan x="769" dy="16" font-style="italic">[rpc.sock]</tspan>
</text>
<path d="M540,330 L540,122 L878,122" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="635.1" y="102" width="147.8" height="40" rx="6" class="pill"/>
<text x="709" y="114" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="709" dy="0">starts it confined</tspan>
<tspan x="709" dy="16" font-style="italic">[agent-init]</tspan>
</text>
<path d="M1000,330 L1000,187" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="947.4" y="238" width="105.19999999999999" height="40" rx="6" class="pill"/>
<text x="1000" y="250" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="1000" dy="0">registers</tspan>
<tspan x="1000" dy="16" font-style="italic">[bus socket]</tspan>
</text>
<rect x="40" y="60" width="240" height="125" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="160" y="97" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="160" font-size="15.5" font-weight="700">Host client</tspan>
<tspan x="160" dy="17" font-size="11.5" opacity="0.85">[Container: e2e script or CLI]</tspan>
<tspan x="160" dy="20" font-size="12.5">Reads control and logs, sends</tspan>
<tspan x="160" dy="17" font-size="12.5">RPC calls, asks for shutdown</tspan>
</text>
<rect x="40" y="330" width="240" height="125" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="160" y="367" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="160" font-size="15.5" font-weight="700">berth-vmm</tspan>
<tspan x="160" dy="17" font-size="11.5" opacity="0.85">[Container: Rust + libkrun]</tspan>
<tspan x="160" dy="20" font-size="12.5">Boots the guest; maps each vsock</tspan>
<tspan x="160" dy="17" font-size="12.5">port to a Unix socket</tspan>
</text>
<rect x="420" y="330" width="240" height="125" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="540" y="358.5" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="540" font-size="15.5" font-weight="700">berth-init</tspan>
<tspan x="540" dy="17" font-size="11.5" opacity="0.85">[Container: Rust, PID 1]</tspan>
<tspan x="540" dy="20" font-size="12.5">Mounts, cgroups, policies,</tspan>
<tspan x="540" dy="17" font-size="12.5">identities; starts daemons and</tspan>
<tspan x="540" dy="17" font-size="12.5">apps; relays vsock</tspan>
</text>
<rect x="880" y="60" width="240" height="125" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="1000" y="97" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="1000" font-size="15.5" font-weight="700">context-bus-daemon</tspan>
<tspan x="1000" dy="17" font-size="11.5" opacity="0.85">[Container: Rust, uid 9001]</tspan>
<tspan x="1000" dy="20" font-size="12.5">Confined under agent-init, in</tspan>
<tspan x="1000" dy="17" font-size="12.5">/berth/daemons</tspan>
</text>
<rect x="880" y="330" width="240" height="125" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="1000" y="367" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="1000" font-size="15.5" font-weight="700">App i</tspan>
<tspan x="1000" dy="17" font-size="11.5" opacity="0.85">[Container: Node.js, uid 10000+i]</tspan>
<tspan x="1000" dy="20" font-size="12.5">SDK runtime under agent-init, in</tspan>
<tspan x="1000" dy="17" font-size="12.5">its own cgroup</tspan>
</text>
<rect x="24" y="526" width="16" height="16" rx="4" fill="#438dd5" stroke="#3c7fc0"/>
<text x="46" y="538.5" font-size="12.5" class="bl">Container</text>
</svg>
