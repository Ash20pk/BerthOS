<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 800" width="1110" height="800" role="img" aria-label="Attestation: containers (C4 level 2)">
<title>Attestation: containers (C4 level 2)</title>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .ln { stroke: #57606a; }
  .bd { stroke: #8c959f; }
  .bl { fill: #57606a; }
  .ah { fill: #57606a; }
  .pill { fill: #f6f8fa; stroke: #d0d7de; }
  .pt { fill: #24292f; }
  @media (prefers-color-scheme: dark) {
    .ln { stroke: #8b949e; }
    .bd { stroke: #6e7681; }
    .bl { fill: #9198a1; }
    .ah { fill: #8b949e; }
    .pill { fill: #161b22; stroke: #30363d; }
    .pt { fill: #e6edf3; }
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
  <marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
</defs>

<path d="M300,122 L438,122" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="334.15" y="110" width="69.69999999999999" height="24" rx="6" class="pill"/>
<text x="369" y="122" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="369" dy="0">appends</tspan>
</text>
<path d="M170,185 L170,328" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="92.55" y="236" width="154.9" height="40" rx="6" class="pill"/>
<text x="170" y="248" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="170" dy="0">tool calls;</tspan>
<tspan x="170" dy="16">reads boot evidence</tspan>
</text>
<path d="M570,330 L570,187" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="506.75" y="236" width="126.5" height="40" rx="6" class="pill"/>
<text x="570" y="248" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="570" dy="0">reads, verifies</tspan>
<tspan x="570" dy="16">the chain</tspan>
</text>
<path d="M440,392 L302,392" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="314.85" y="372" width="112.3" height="40" rx="6" class="pill"/>
<text x="371" y="384" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="371" dy="0">reads live</tspan>
<tspan x="371" dy="16">boot evidence</tspan>
</text>
<path d="M700,392 L838,392" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="709.3" y="372" width="119.39999999999999" height="40" rx="6" class="pill"/>
<text x="769" y="384" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="769" dy="0">runs, or reads</tspan>
<tspan x="769" dy="16">its result</tspan>
</text>
<path d="M570,455 L570,598" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="496.1" y="506" width="147.8" height="40" rx="6" class="pill"/>
<text x="570" y="518" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="570" dy="0">writes</tspan>
<tspan x="570" dy="16" font-style="italic">[--out, mode 0600]</tspan>
</text>
<path d="M840,657 L702,657" fill="none" class="ln" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="714.85" y="637" width="112.3" height="40" rx="6" class="pill"/>
<text x="771" y="649" text-anchor="middle" dominant-baseline="middle" font-size="12" class="pt">
<tspan x="771" dy="0">checks shape,</tspan>
<tspan x="771" dy="16">hash, status</tspan>
</text>
<rect x="40" y="60" width="260" height="125" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="170" y="88.5" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="170" font-size="15.5" font-weight="700">berth mcp</tspan>
<tspan x="170" dy="17" font-size="11.5" opacity="0.85">[Container: Node.js, berth CLI]</tspan>
<tspan x="170" dy="20" font-size="12.5">Records every tool call under a</tspan>
<tspan x="170" dy="17" font-size="12.5">run id, and the boot evidence once</tspan>
<tspan x="170" dy="17" font-size="12.5">per session</tspan>
</text>
<path d="M440,70 a130,10 0 0 0 260,0 v105 a130,10 0 0 1 -260,0 z" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<ellipse cx="570" cy="70" rx="130" ry="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="570" y="111.5" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="570" font-size="15.5" font-weight="700">Audit file</tspan>
<tspan x="570" dy="17" font-size="11.5" opacity="0.85">[Data store: hash-chained JSONL]</tspan>
<tspan x="570" dy="20" font-size="12.5">~/.berth/audit/audit.jsonl</tspan>
</text>
<rect x="40" y="330" width="260" height="125" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="170" y="367" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="170" font-size="15.5" font-weight="700">Sandbox</tspan>
<tspan x="170" dy="17" font-size="11.5" opacity="0.85">[Container: Docker or microVM]</tspan>
<tspan x="170" dy="20" font-size="12.5">Boot ID, ruleset reports, policy</tspan>
<tspan x="170" dy="17" font-size="12.5">hashes computed inside</tspan>
</text>
<rect x="440" y="330" width="260" height="125" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="570" y="358.5" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="570" font-size="15.5" font-weight="700">berth attest</tspan>
<tspan x="570" dy="17" font-size="11.5" opacity="0.85">[Container: Node.js, berth CLI]</tspan>
<tspan x="570" dy="20" font-size="12.5">Builds the record and refuses to</tspan>
<tspan x="570" dy="17" font-size="12.5">emit one that fails its own</tspan>
<tspan x="570" dy="17" font-size="12.5">verifier</tspan>
</text>
<rect x="840" y="330" width="240" height="125" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="960" y="358.5" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="960" font-size="15.5" font-weight="700">Enforcement probe</tspan>
<tspan x="960" dy="17" font-size="11.5" opacity="0.85">[Container: berth doctor probe]</tspan>
<tspan x="960" dy="20" font-size="12.5">For the image and runtime. A</tspan>
<tspan x="960" dy="17" font-size="12.5">microVM's is derived from its</tspan>
<tspan x="960" dy="17" font-size="12.5">kernel</tspan>
</text>
<path d="M440,610 a130,10 0 0 0 260,0 v95 a130,10 0 0 1 -260,0 z" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<ellipse cx="570" cy="610" rx="130" ry="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="570" y="638" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="570" font-size="15.5" font-weight="700">Attestation record</tspan>
<tspan x="570" dy="17" font-size="11.5" opacity="0.85">[Data store: JSON]</tspan>
<tspan x="570" dy="20" font-size="12.5">recordSha256 over every other</tspan>
<tspan x="570" dy="17" font-size="12.5">field</tspan>
</text>
<rect x="840" y="600" width="240" height="115" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
<text x="960" y="632" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
<tspan x="960" font-size="15.5" font-weight="700">Verifier</tspan>
<tspan x="960" dy="17" font-size="11.5" opacity="0.85">[Container: Node.js, standalone]</tspan>
<tspan x="960" dy="20" font-size="12.5">verify-attestation.mjs, or</tspan>
<tspan x="960" dy="17" font-size="12.5">verifyAttestation()</tspan>
</text>
<rect x="24" y="766" width="16" height="16" rx="4" fill="#438dd5" stroke="#3c7fc0"/>
<text x="46" y="778.5" font-size="12.5" class="bl">Container</text>
</svg>
